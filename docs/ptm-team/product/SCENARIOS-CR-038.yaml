    n_a_reason: "DEF-038-04 已延后，首版只做下发 + 台账占用闭环，回滚留待 CP7"

  # ---- precheck 场景 ----
  - id: SCN-038-PRE-001
    category: precheck
    name: ptm-atomic PPPoE op 可用性预检
    requirement: R-F-005
    given: "LLD 阶段"
    when: "核实 ptm-atomic CLI 是否暴露 PPPoE 拨号 op"
    then: "若缺失则列为跨仓库依赖或映射到可用 op"
