source_feature_matrix: null # Feature 设计矩阵 N/A（单能力面 case-execution 内部扩展，无跨 Feature 拆分）

# 三 Wave：W1 基础设施可并行；W2 case_runner 链式（同文件所有权互斥）；W3 测试与同步收口
parallel_policy:
  max_parallel_lld: 2
  max_parallel_dev: 2
  max_parallel_qa: 1

common_forbidden:
  - process/changes/CR-056.md
  - process/HLD-CR-056.md
  - ptm-te-manaul/cases/tde/**（设计源只读）
  - ptm-te-manaul/cases/te/**（312 条存量用例实质内容禁改；仅允许 case_runner mark 写入 mark 行）

security_constraints:
  - 全程 static-only / dry-run-only：单测 + 冒烟解析 + git 操作模拟，不触发真实设备执行，不触碰 trex / telnet / SSH 凭据；DQ-01 授权语义不变
  - init_cases_repo.py 与 mark 子命令永不 push、永不 force、永不改已存在 remote；git switch origin/main 前必须校验工作树一致（HLD §10 abort 路径）
  - GitLab ssh -T 连通判定以输出含 "Welcome to GitLab" 为准，禁止 exit code 判定（HLD Gotcha G-1）
  - 台账写入全程 ledger_lock 文件锁；人工区 submitter/notes/open_issues 逐字段原样保留（HLD G-5/G-7）
  - 存量 312 条 te 用例只允许经 case_runner mark 写入 mark 字段；指纹剔除 mark 行仅限 frontmatter 块内（HLD G-4）
  - 副本同步完整性：case_runner.py 4 副本 / case_ledger.py 与 init_cases_repo.py 分发副本 / CLAUDE.md 规则 3 副本 / agent md 3 副本，收口 Story 统一校验一致
  - 与 CR-053 无文件重叠（run_checkpoint.py / gate-spec 不在本 CR 影响面），无并行写冲突

