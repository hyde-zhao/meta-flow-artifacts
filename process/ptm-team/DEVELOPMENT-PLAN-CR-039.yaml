# 全 Story 统一安全与实施约束（正文 dev_context 必引用，实现与验证均不得违反）
security_constraints:
  - 凭据一律 ${ENV_VAR} 占位，禁止明文落盘；sw3 族 telnet 密码走 SW3_PASSWORD 环境变量（ADR-02，CR-046）
  - 默认 --dry-run；真机下发（trex 发流 / SSH 重启 trex-stl-te）为独立 runtime_authorization，DQ-039-04 明确不授权，本 CR 仅 static-only 验证
  - 回源方式：以 canonical HEAD 为基底逐块审计合并（G1/G4/G5 各块独立 diff），禁止整文件覆盖——op_mapper.py 的 INTENT_TO_OP / ARGS_TO_FLAGS 等 dict 内容级差异函数签名抓不到，逐块合并避免 canonical 领先时反向覆盖（b4719e8 先例）
  - CR-047 post_delay 精细排除：回源 case_runner 时排除工作区 case_runner.py L114-133（_parse_post_delay）与 L2438-2440（time.sleep OP_INTERVAL_SEC+post_delay 改动），不得整文件覆盖引入；排除项记入 STORY-039-04 BACKLOG-CR-039.md
  - G6 M9 归属（T-3 台账项）在 IMPLEMENTATION.md 补记留痕，不阻塞本 CR 门禁
  - sw3 用例样例来源：工作区 CR-046 验证用例（node3_dut1_tg1_sw1_pppoe_link3）
  - 不得修改已 approve 的 CP2 checkpoint / CP3 自动预检 / meta-pm 交还摘要；不得新建 docs/product/REQUIREMENTS-CR-039.md 等 N/A 产物

