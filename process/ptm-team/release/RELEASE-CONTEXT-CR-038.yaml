    MIGRATION 无破坏性数据迁移（N/A + 理由）；FEEDBACK 有真机回流 + follow-up 入口。
    full profile 专用 CHANGELOG / INSTALL / TROUBLESHOOTING / POST-RELEASE-OBSERVATION 不生成。
