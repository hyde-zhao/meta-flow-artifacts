status: "ready"
created_at: "2026-07-15T08:08:00+00:00"
created_by: "host-orchestrator"
source_cr: "CR-030"

token_control:
  read_profile: "compact"
  max_source_files: 8
  max_summary_items: 18
  full_doc_read_policy: "only-on-missing-conflict-audit-or-deep-review"
  full_doc_read_reason: ""
  default_instruction: "先读本 capsule；只读 allowed_reads/must_read。只在缺失、冲突、审计或深度评审时读全文并记录扩展。"

allowed_reads:
  - {path: "process/state/STATE.current.json", reason: "阶段、门禁和活跃 CR", required: true}
  - {path: "process/changes/summaries/CR-030.summary.json", reason: "变更边界和不授权项", required: true}
  - {path: "docs/product/USE-CASES.md", reason: "已确认场景", required: true}
  - {path: "docs/product/REQUIREMENTS.md", reason: "已确认可验收需求", required: true}
  - {path: "docs/product/STORY-MAP.md", reason: "MVP Story 与追溯", required: true}
  - {path: "docs/product/MVP-SCOPE.md", reason: "确认范围与 deferred", required: true}
  - {path: "docs/design/BLUEPRINT.md", reason: "能力边界与数据 owner", required: true}
  - {path: "docs/design/HLD.md", reason: "候选方案、推荐和 CP3 决策", required: true}

must_read:
  - {path: "process/state/STATE.current.json", reason: "机器状态", required: true}
  - {path: "docs/product/REQUIREMENTS.md", reason: "确认需求", required: true}
  - {path: "docs/design/HLD.md", reason: "CP3 审查对象", required: true}
  - {path: "docs/design/ARCHITECTURE-DECISION.md", reason: "待确认 ADR", required: true}

read_if_needed:
  - {path: "process/changes/CR-030-ptm-tse-reverse-analysis-capability.md", trigger: "field_conflict/human_audit/deep_review"}
  - {path: "process/discussions/CP2-SCENARIO-DISCUSSION-LOG-CR030.md", trigger: "审计 CP2 scope/security 选择"}

do_not_read_by_default:
  - {path_or_pattern: "process/STATE.md", reason: "人类摘要，不是机器入口"}
  - {path_or_pattern: "process/stories/**", reason: "CP3 前不得读取或创建 Story LLD"}
  - {path_or_pattern: "process/archive/**", reason: "历史冷数据"}
  - {path_or_pattern: "完整会话 transcript", reason: "禁止作为设计输入"}

key_facts:
  scope_summary: "恢复后现网问题；P1 必做、P2 可选；外部读取/生产操作/内部问题均不在范围。"
  accepted_decisions:
    - "CP2 已批准文件化、人工确认、无 runtime 的产品范围。"
    - "四 Story 共享状态模型与安全 ADR，HLD 不拆分。"
  active_constraints:
    - "CP3 未批准前不得 Story 拆分或实现。"
    - "本期不存在外部 adapter、通知或自动下游写入。"
  downstream_tasks:
    - "用户在 CP3 确认 Skill 切分、Approved Improvement Input 交接形态和自动化等级。"
  traceability:
    requirements: ["REQ-RA-001..013"]
    use_cases: ["UC-RA-01..06"]
    scenarios: ["SCN-RA-01..07"]
    stories: ["ST-RA-01..04"]
    features: ["FEAT-RA-ANALYSIS", "FEAT-RA-IMPROVEMENT", "FEAT-RA-TRACKING"]

risks_and_decisions:
  pending_human_decisions: ["CP3-DQ-CR030-01", "CP3-DQ-CR030-02", "CP3-DQ-CR030-03"]
  non_authorized_items: ["credentials", "external reads", "production write", "auto remediation", "internal-problem analysis"]
  risk_acceptance_items: []
  open_questions: ["CP3 选择的 canonical Skill 名称与边界", "消费者 AII 的最低字段集"]
  n_a_or_waived_items: ["runtime integration: N/A — requires separate CR"]

handoff:
  target_agent: "host-orchestrator / user CP3 review"
  expected_output: ["CP3 approve / changes requested / reject"]
  exit_criteria: ["所有 CP3-DQ 有用户结论", "HLD/ADR 与结论同步", "CP3 approved 后才可 Story planning"]
  blocked_if_missing: ["没有 CP3 结论，不得进入 CP4/CP5/implementation"]

read_expansion_log: []
validation:
  generated_from_sources: ["docs/product/*", "docs/design/BLUEPRINT.md", "docs/design/DOMAIN-MAP.md", "docs/design/DEPENDENCY-MAP.md", "docs/design/HLD.md"]
  missing_sources: []
  consistency_status: "pass"
  notes: ["CP3 是人工架构门；本 capsule 不替代 HLD。"]
