# 通用禁止触碰文件（所有 Story 共同遵守，meta-dev 不得越级改写已 approve 对象）
common_forbidden:
  - docs/product/REQUIREMENTS-CR-038.md
  - docs/product/MVP-SCOPE-CR-038.md
  - docs/product/USE-CASES-CR-038.md
  - docs/design/HLD-CR-038.md
