  - docs/design/DEPENDENCY-MAP-CR-038.md

# 全 Story 统一安全约束（正文 dev_context 必引用，实现与验证均不得违反）
security_constraints:
  - 凭据一律 ${ENV_VAR} 占位，禁止明文（ADR-02 / ADR-CR038-03）
  - local-user 密码保持设备 cipher 密文，禁止反解
  - 默认 --dry-run；真机下发（H3C telnet / NGFW web / trex）为独立 runtime_authorization，CP 批准不隐含
  - 现有 GE 实例（GE1_1~4）禁止改动其进程/cfg/wrapper，只操作 TE 实例与 TE2_1~4 端口
  - 不得修改已 approve 的 REQUIREMENTS-CR-038.md / HLD-CR-038.md / ARCHITECTURE-DECISION-CR-038.md / 蓝图三件套

