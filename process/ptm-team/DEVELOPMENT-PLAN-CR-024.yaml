  - id: STORY-024-04
    name: 安装器集成与验证
    slug: installer-integration
    tier: S
    wave: W3
    lld_policy: technical-note
    feature_design_refs: [ptm-te-agent]
    dependencies: [STORY-024-01, STORY-024-02, STORY-024-03]
    file_owners:
      - script/ptm_team/install.py
      - skills/README.md
      - docs/ptm-team-blueprint.md
