waves:
  W1:
    stories: [STORY-024-01]
    parallel: false
    rationale: agent 骨架是基础，定义全部下游 skill 消费契约
  W2:
    stories: [STORY-024-02, STORY-024-03]
    parallel: true
    rationale: 两个独立 skill，文件所有权无冲突，可并行
  W3:
    stories: [STORY-024-04]
    parallel: false
    rationale: 依赖前 3 个 Story 产物

parallel_safety:
  W2_conflict_check:
    STORY-024-02_files: [skills/device-management/**, skills/device-connection/**]
    STORY-024-03_files: [skills/policy-route-execution/**]
    overlap: none
    verdict: safe-to-parallel
  cross_wave_conflict_check:
    STORY-024-04_vs_01_02_03:
      STORY-024-04_files: [script/ptm_team/install.py, skills/README.md, docs/ptm-team-blueprint.md]
      overlap_with_S1: none
      overlap_with_S2: none
      overlap_with_S3: none
      verdict: safe (S4 在 W3，前 3 个 Story 已完成)

lld_design_batch:
  batch_id: CR-024-lld-batch
  target_stories: [STORY-024-01, STORY-024-02, STORY-024-03, STORY-024-04]
  full_lld: [STORY-024-01, STORY-024-02, STORY-024-03]
  technical_note: [STORY-024-04]
  max_parallel_lld: 3
