  - {id: "QW2", stories: ["ST-AW-002"], parallel: false}
  - {id: "QW3", stories: ["ST-AW-003", "ST-AW-004"], parallel: true, note: "Separate target matrix and pure aggregate suites; shared integration regression may run once and be referenced by both independent verdicts."}
  - {id: "QW4", stories: ["ST-AW-005"], parallel: false}

forbidden_global:
  - "process/quant-lab/**"
  - "../meta-flow-artifacts/process/* except the routed meta-flow process namespace"
  - "real meta-flow-artifacts file migration or existing symlink mutation"
