  max_parallel_dev: 2
  max_parallel_qa: 2
  wave_is_scheduling_hint: true
  all_story_design_before_dev: true
  contract_dependency_parallelism: "Allowed only after the referenced Feature/Story contract is frozen by CP5."
  runtime_dependency_policy: "Downstream development waits for upstream verified unless an explicit equivalent fixture is approved."
  shared_file_policy: "Primary paths never overlap. meta_flow/cli.py has one CR-051 merge owner, ST-AW-004; other Stories submit wiring serially and do not write it in parallel."
  rationale: "LLD may be drafted in two batches. Development follows W1->W2->W3->W4; ST-AW-003/004 may run in parallel only with frozen LegResult contract and disjoint primary files."

dependency_edges:
  - {from: "ST-AW-001", to: "ST-AW-002", type: "contract", lld_gate: "route/context contract declared", dev_gate: "ProjectContext and RouteDecision frozen at CP5"}
