    required: true
  - path: "meta_flow/workspace/git_sync.py"
    reason: "当前 workspace/git sync 事实；只读"
    required: true
  - path: "meta_flow/workspace/routing.py"
    reason: "当前 artifact routing 事实；只读"
    required: true
  - path: "tests/test_git_branch_lifecycle.py"
    reason: "既有行为与 CR-050 契约事实；只读"
    required: false
  - path: "tests/test_workspace_git_sync.py"
    reason: "既有 workspace sync 测试事实；只读"
    required: false
  - path: "process/docs/design/CR050-GIT-BRANCH-HLD.md"
    reason: "paired-default 历史架构，只用于兼容/冲突分析"
    required: false
  - path: "process/docs/design/CR050-GIT-BRANCH-ARCHITECTURE-DECISION.md"
    reason: "CR-050 ADR 适用前提和 supersession 分析"
