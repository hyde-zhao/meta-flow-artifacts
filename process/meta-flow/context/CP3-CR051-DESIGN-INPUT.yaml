    required: true
  - path: "process/checkpoints/CP2-CR051-PROJECT-FIRST-WORKTREE-BASELINE-R3.md"
    reason: "CP2 approved 基线与 CP3-DC-01"
    required: true
  - path: "process/checks/CP3-CR051-ARCHITECTURE-INPUTS.json"
    reason: "worktree switch 非原子恢复约束和灰区候选"
    required: true
  - path: "process/docs/product/REQUIREMENTS.md"
    reason: "27 条 AW 需求及验收契约"
    required: true
  - path: "process/docs/product/USE-CASES.md"
