status: "ready"
created_at: "2026-07-18T03:37:15Z"
created_by: "host-orchestrator"
source_cr: "CR-051"

token_control:
  read_profile: "compact"
  max_source_files: 20
  max_summary_items: 20
  full_doc_read_policy: "only-on-missing-conflict-audit-or-deep-review"
  full_doc_read_reason: ""
  default_instruction: "meta-se 先读本 capsule 与 machine context；只在架构事实缺失、冲突、审计或深度评审时扩展，并记录 read expansion。"

must_read:
  - path: "process/context/CP3-CR051-DESIGN-INPUT.yaml"
    reason: "CP3 最小设计输入"
    required: true
  - path: "process/state/STATE.current.json"
    reason: "确认 CR-051、solution-design 与授权边界"
    required: true
  - path: "process/changes/summaries/CR-051.summary.json"
