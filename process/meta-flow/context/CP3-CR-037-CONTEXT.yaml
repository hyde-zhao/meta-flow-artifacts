    - "不执行 runtime、production write、publish、live 或真实交易。"
    - "不读取凭据、账户、token、cookie 或私钥。"
    - "不自动修改 quant-lab 发布库代码、测试、正式设计文档或发布文档。"
    - "不关闭、恢复或完成 CR-036。"
  risk_acceptance_items:
