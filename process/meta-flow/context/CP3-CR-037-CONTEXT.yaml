    - "CP3-CR037-DQ-03: 是否确认 roadmap refresh 使用独立 result/checker 且只写过程归档库"
    - "CP3-CR037-DQ-04: 是否确认 feature/capability registry refs 与 impact normalization 架构"
    - "CP3-CR037-DQ-05: 是否确认 FU-RF / SP-RF / RA-RF follow-up 不进入 RELEASE-CONTEXT"
    - "CP3-CR037-DQ-06: 是否确认 9 个 required Feature 的 per-feature 设计在 CP3 后、CP5 前生成"
    - "CP3-CR037-DQ-07: 是否确认正式 Story / slice / evidence 命名使用 CR-037 派生编号，CR-A..CR-H 仅作为计划 alias"
  non_authorized_items:
