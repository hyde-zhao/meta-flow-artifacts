read_if_needed:
  - path: "process/changes/CR-051.md"
    trigger: "CR summary 缺少五维影响或文档处理决策；读取后必须记录 read expansion"
  - path: "process/docs/product/*"
    trigger: "人工审查需要核对正式条目、计数冲突或 R3 追溯时"
  - path: "process/discussions/CP2-CR051-SCENARIO-DISCUSSION-LOG.md"
    trigger: "需要审计 SGQ-AW-003 对话恢复证据时；读取后必须记录 read expansion"

do_not_read_by_default:
  - path_or_pattern: "process/STATE.md"
    reason: "生成的人类摘要，不作为机器入口"
  - path_or_pattern: "process/DEVELOPMENT-PLAN.yaml"
    reason: "CP2 批准前禁止复用旧开发计划"
  - path_or_pattern: "process/changes/CR-*.md"
    reason: "默认读取 CR summary；全文只在冲突或审计时展开"
  - path_or_pattern: "process/stories/**"
    reason: "CP2 批准前禁止 Story/LLD 消费"
  - path_or_pattern: "process/archive/**"
    reason: "历史归档不属于当前门禁默认上下文"
  - path_or_pattern: "process/discussions/**"
    reason: "讨论日志仅用于人工审计和恢复"
  - path_or_pattern: "../meta-flow-artifacts/process/quant-lab/**"
    reason: "其他项目运行态，禁止读取和修改"
  - path_or_pattern: "完整会话 transcript"
    reason: "当前决策已进入结构化决策文件与正式产品文档"

key_facts:
  scope_summary: "在 meta-flow 中开发 project-first artifact 路由、每项目独立 worktree 和项目作用域 Git 生命周期能力；真实文件迁移、软链接重挂、真实 Git/remote mutation 与 main/integration 同步后置。"
  accepted_decisions:
    - "project-first：目标语义为 <project_name>/docs 与 <project_name>/process。"
    - "artifact 仓每项目长期 projects/<project-name>/integration；项目 worktree 空闲时驻留该分支。"
    - "artifact 每个 CR 使用 projects/<project-name>/cr/<cr-id>-<slug> 短期分支，只从/回同一项目 integration。"
    - "source leg 从 fresh 源码 main/master 创建短期 CR 分支，完成后进入同一源码默认分支。"
    - "artifact CR 不 refresh、merge 或直接更新 shared main；shared main 与 project integration 的双向同步完全位于 CR 外并由人工执行。"
    - "单一协调者按 BLOCKED > FAIL > IN_PROGRESS > PASS 聚合必需 legs；仅全 PASS 完成，PARTIAL 只表示 progress/effect。"
    - "integration 缺失时从 fresh origin/main exact OID create-only 初始化；已存在时禁止 recreate/reset/orphan。"
    - "保留 existing control checkout；项目 worktree 位于 configurable sibling root，执行 namespace/sparse/owned-path gate。"
    - "能力先行；真实迁移和软链接挂接由用户后续逐项目实施。"
  active_constraints:
    - "shared main 不作为任一项目 owned/idle working branch，也不是 artifact per-CR target。"
    - "main/integration divergence 不是单个 CR blocker；artifact integration expected OID 漂移才阻断 artifact finish。"
    - "finish/abort 后不得让 worktree 滞留在已结束短期 CR branch。"
    - "失败 leg 不自动关闭逻辑 CR，也不回滚已成功 leg；不声明跨仓原子事务。"
    - "其他项目 dirty 不阻断当前项目；当前项目 worktree dirty 按操作风险阻断。"
    - "CP2 R3 总体 approve 前不得进入 CP3、Story、LLD 或实现。"
    - "真实 Git/worktree/link/remote mutation 当前授权数量为 0。"
  downstream_tasks:
    - "用户 approve CP2 R3 后调度 meta-se 生成 BLUEPRINT、DOMAIN-MAP、DEPENDENCY-MAP、HLD 和 ADR。"
    - "CP3 冻结 metadata/path schema、namespace/sparse/owned-path gate、双 leg 命令/OID/cleanup 状态机、聚合结果 schema、ledger 单写、bootstrap CAS 与人工同步 precheck。"
    - "CP3 不得恢复 R2 的 per-CR artifact main refresh，不得提前生成正式 Story 或修改源码。"
  traceability:
    requirements: ["REQ-AW-001..017", "REQ-AW-C001..005", "REQ-AW-NF001..005"]
    use_cases: ["UC-AW-001..005"]
    scenarios: ["TC-AW-001..015"]
    stories: ["ST-AW-001..005（产品候选，非 CP4 Story 卡片）"]
    features: ["M-AW1..4（产品里程碑，Feature 边界待 CP3/CP4）"]

risks_and_decisions:
  pending_human_decisions:
    - "无未解决 DQ；仅待用户对 CP2 R3 整体产品基线回复 approve / 修改 / reject。"
  resolved_decisions:
    - "CP2-DQ-01：长期项目 integration、短期项目 CR、shared main 基线。"
    - "CP2-DQ-03：existing-control + sibling-root + namespace/sparse/owned-path gate。"
    - "CP2-DQ-04：异构 source-default / artifact-integration 双 leg。"
    - "CP2-DQ-05：单一 aggregate gate，仅全 PASS 完成。"
    - "CP2-DQ-06：integration create-only bootstrap 与 CR 外人工同步。"
  superseded_decisions:
    - "CP2-DQ-02：R2 per-CR merge-main 语义由 CP2-DQ-04 替代，仅保留历史。"
  non_authorized_items:
    - "源码实现或跳过 CP3/CP5"
    - "真实 meta-flow-artifacts 文件迁移或软链接变更"
    - "真实 worktree/branch/ref 创建、删除、提交或推送"
    - "真实 shared main 与 project integration 同步"
    - "remote fetch/push/default update/delete、force、凭据、runtime 或 production write"
  risk_acceptance_items: []
  open_questions:
    - "仅 CP3 设计细化：metadata/path schema、namespace/sparse/owned-path gate、双 leg 命令/OID/cleanup、aggregate result/ledger 单写/receipt、bootstrap CAS、人工同步 precheck 与失败恢复。"
  n_a_or_waived_items: []

