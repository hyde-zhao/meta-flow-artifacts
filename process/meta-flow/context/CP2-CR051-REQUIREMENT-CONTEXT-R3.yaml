    - "source-default leg、artifact-integration leg、aggregate gate、bootstrap 与人工同步边界可审查"
    - "R2 per-CR artifact main refresh 不得恢复，且未提前进入实现"
  blocked_if_missing:
    - "CP2 R3 尚未 approved"
    - "artifact CR target 被改回 shared main"
    - "聚合完成条件不是所有必需 leg PASS"

