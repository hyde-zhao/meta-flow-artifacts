      recommendation: "worktree 外 durable intent + fresh observation + conditional rollback/recovery-required"
      fallback: "禁用自动 switch，改为人工操作/检查"
    - id: "CP3-CR051-DQ-02"
      recommendation: "shared envelope + typed append-only evidence DAG + aggregate 单写"
      fallback: "Feature 独立 schema；或后续外部不可变账本"
    - id: "CP3-CR051-DQ-03"
      recommendation: "project lock + exact ordinary ref update + fresh postcheck；manual-sync CR 外显式人工执行"
      fallback: "后续 forge API/merge-queue adapter"
