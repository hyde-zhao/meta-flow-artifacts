key_invariants:
  - "artifact CR 只从/回 projects/<project>/integration，不触碰 shared main。"
  - "source/artifact required legs 仅全部 PASS 时 overall PASS；PARTIAL 非成功终态。"
  - "integration 仅缺失时从 fresh origin/main exact OID create-only 初始化。"
  - "git switch 退出码不是成功证明；必须 durable intent 与 fresh post-observation。"
  - "不安全时保留现场并 RECOVERY_REQUIRED/BLOCKED；禁止 reset/clean/stash/force/delete/overwrite。"
  - "shared main ↔ integration 同步在 CR 外、人工、独立授权。"

approval_effect:
