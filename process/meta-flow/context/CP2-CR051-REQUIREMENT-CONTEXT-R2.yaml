    required: false
  - path: "process/docs/product/SCENARIOS.yaml"
    reason: "人工审查需要时核对 15 个 CR-051 场景"
    required: false
  - path: "process/docs/product/TEST-MATRIX.md"
    reason: "人工审查需要时核对追溯覆盖"
    required: false
  - path: "process/docs/product/MVP-SCOPE.md"
    reason: "人工审查需要时核对能力与迁移边界"
    required: false

must_read:
  - path: "process/context/CP2-CR051-REQUIREMENT-CONTEXT-R2.yaml"
    reason: "R2 阶段最小事实与读取边界"
    required: true
  - path: "process/state/STATE.current.json"
    reason: "验证 active CR、阶段和 pending gate"
    required: true
  - path: "process/checks/CP2-CR051-REQUIREMENTS-BASELINE-R2.result.json"
