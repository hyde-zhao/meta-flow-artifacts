  n_a_or_waived_items: []

handoff:
  target_agent: "meta-se（仅 CP2 R2 approve 后）"
  expected_output:
    - "process/docs/design/BLUEPRINT.md"
    - "process/docs/design/DOMAIN-MAP.md"
    - "process/docs/design/DEPENDENCY-MAP.md"
    - "process/docs/design/HLD.md"
    - "process/docs/design/ARCHITECTURE-DECISION.md"
    - "process/checks/CP3-CR051-*.result.json"
  exit_criteria:
    - "CP3 HLD/ADR 覆盖全部 27 条 AW 需求和 15 个场景"
    - "integration↔CR↔main 状态机、失败路径和授权边界可审查"
    - "未提前进入实现"
  blocked_if_missing:
