schema_version: "1.0"
capsule_id: "CP4-CR051-STORY-PLANNING-CONTEXT"
project_id: "meta-flow"
workflow_id: "meta-flow-self-dev"
phase: "story-planning"
checkpoint: "CP4"
status: "ready"
created_at: "2026-07-18T05:56:00Z"
created_by: "host-orchestrator"
source_cr: "CR-051"
read_profile: "compact"
token_control:
  read_profile: "compact"
  full_doc_read_policy: "only-on-missing-conflict-audit-or-feature-detail"
must_read:
  - path: "process/checkpoints/CP3-CR051-ARTIFACT-WORKTREE-HLD-REVIEW.md"
    reason: "approved CP3 decisions, R2 review obligations and non-authorization boundary"
  - path: "process/docs/design/CR051-ARTIFACT-WORKTREE-HLD.md"
    reason: "confirmed architecture, Feature triggers and O-AW-01..03 downstream routes"
  - path: "process/docs/design/CR051-ARTIFACT-WORKTREE-ARCHITECTURE-DECISION.md"
    reason: "approved ADRs, alternatives and switch conditions"
  - path: "process/docs/design/CR051-ARTIFACT-WORKTREE-BLUEPRINT.md"
    reason: "five Feature boundaries and ownership"
  - path: "process/docs/product/STORY-MAP.md"
    reason: "stable ST-AW-001..005 product Story scope"
read_if_needed:
  - path: "process/docs/design/CR051-ARTIFACT-WORKTREE-DOMAIN-MAP.md"
    trigger: "field/state/single-writer contract detail"
  - path: "process/docs/design/CR051-ARTIFACT-WORKTREE-DEPENDENCY-MAP.md"
    trigger: "DAG, forbidden dependency or file-owner audit"
  - path: "process/docs/product/REQUIREMENTS.md"
    trigger: "REQ-AW acceptance trace gap"
  - path: "process/docs/product/SCENARIOS.yaml"
    trigger: "TC-AW fixture mapping detail"
  - path: "process/docs/product/TEST-MATRIX.md"
    trigger: "Story-to-test trace audit"
  - path: "process/docs/product/MVP-SCOPE.md"
    trigger: "scope or deferred boundary conflict"
  - path: "meta_flow/workflow/git_branch_lifecycle.py"
    trigger: "existing module/interface/file ownership scan"
  - path: "meta_flow/workspace/routing.py"
    trigger: "project routing integration point scan"
  - path: "meta_flow/workspace/git_sync.py"
    trigger: "native Git adapter reuse scan"
  - path: "meta_flow/cli.py"
    trigger: "CLI integration and command ownership scan"
do_not_read_by_default:
  - path_or_pattern: "process/archive/**"
    reason: "cold history is not a current planning input"
  - path_or_pattern: "process/quant-lab/**"
    reason: "sibling project is outside CR-051"
  - path_or_pattern: "../meta-flow-artifacts/process/*"
    reason: "only the routed meta-flow process namespace is authorized"
key_facts:
  approved_story_ids: ["ST-AW-001", "ST-AW-002", "ST-AW-003", "ST-AW-004", "ST-AW-005"]
  approved_features: ["FEAT-AW-01", "FEAT-AW-02", "FEAT-AW-03", "FEAT-AW-04", "FEAT-AW-05"]
  artifact_cr_target: "projects/<project>/integration"
  source_cr_target: "source default main/master"
  shared_main_sync: "CR-external, explicit, manual, separately authorized"
  aggregate_rule: "BLOCKED > FAIL > IN_PROGRESS > PASS; only all required legs PASS completes logical CR"
  capacity_obligation: "O-AW-01; bounded 512MiB only after CP5 0 false-safe/underestimate proof"
  durable_store_obligation: "O-AW-02; any persistence fault blocks before Git mutation"
  manual_sync_obligation: "O-AW-03; fixed thresholds create follow-up candidate only"
  authorization_boundary: "No source implementation or real Git/worktree/ref/remote/link/migration/main-sync mutation before CP5 approval."
required_outputs:
  - "process/docs/design/CR051-FEATURE-DESIGN-MATRIX.md"
  - "process/docs/features/cr051-*/DESIGN.md"
  - "process/docs/features/cr051-*/TEST-PLAN.md"
  - "process/docs/features/cr051-*/TASKS.md"
  - "process/DEVELOPMENT-PLAN.yaml"
  - "process/STORY-BACKLOG.md"
  - "process/STORY-STATUS.md"
  - "process/stories/STORY-ST-AW-*.md"
  - "process/checks/CP4-CR051-STORY-DAG-PARALLEL-SAFETY.result.json"
  - "process/checks/CP4-CR051-STORY-DAG-PARALLEL-SAFETY.result.summary.md"
stop_conditions:
  - "CP4 automatic precheck FAIL/BLOCKED"
  - "new blocking architecture/security/runtime authorization decision"
  - "attempt to enter implementation or mutate real Git/worktree/remote"
