  - path: "process/archive/CR-037/evidence-index.json"
    trigger: "审计完整证据索引时读取"

do_not_read_by_default:
  - path_or_pattern: "process/quant-lab/**"
    reason: "quant-lab 迁移属于 P2；CP2 不读取或修改 quant-lab 发布库 / 过程归档内容"
  - path_or_pattern: "process/archive/**"
    reason: "归档证据只在人工审计或证据缺失时读取"
  - path_or_pattern: "process/STATE.md"
    reason: "legacy 人类摘要，不作为默认机器上下文；仅字段缺失或人工审计时读取"
  - path_or_pattern: "完整会话 transcript"
    reason: "不得作为下游默认输入"

