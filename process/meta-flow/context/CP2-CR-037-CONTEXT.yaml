  - path: "process/docs/product/REQUIREMENTS.md"
    reason: "确认 REQ-PG-* 需求基线"
    required: true
  - path: "process/docs/product/SCENARIOS.yaml"
    reason: "确认 TC-PG-* 工程验证场景"
    required: true
  - path: "process/docs/product/TEST-MATRIX.md"
    reason: "确认追溯矩阵"
    required: true
  - path: "process/docs/product/STORY-MAP.md"
    reason: "确认 ST-PG-* 和 release slice 顺序"
    required: true
  - path: "process/docs/product/MVP-SCOPE.md"
    reason: "确认 scope / out of scope / deferred"
    required: true

read_if_needed:
