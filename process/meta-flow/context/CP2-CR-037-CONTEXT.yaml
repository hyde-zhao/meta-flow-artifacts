  - path: "process/docs/design/META-FLOW-PROJECT-GOVERNANCE-HLD.md"
    trigger: "审查 CP3 待确认设计基线时读取"
  - path: "process/docs/design/META-FLOW-PROJECT-GOVERNANCE-FEATURE-DESIGN-MATRIX.md"
