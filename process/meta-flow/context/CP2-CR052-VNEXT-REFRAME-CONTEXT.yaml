    - "批量迁移其他项目"
    - "历史重写或分布式自动 merge"
    - "force/reset/rebase/orphan/credentials/runtime/production/publish/trading"
  risk_acceptance_items: []
  open_questions: []
  n_a_or_waived_items: []

