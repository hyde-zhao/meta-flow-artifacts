    - "过程库每项目独立、main-only、单写 publisher + expected-OID CAS"
    - "快照迁移当前状态，不重写历史"
    - "两个试点项目，每项目至少两个工作周期"
  active_constraints:
    - "CP2 approved 前不得拆 Story、写 LLD 或修改实现代码"
    - "不得 push、批量迁移、历史重写或执行 runtime/production 写入"
    - "产品文档增量更新，保留历史 ID 和修订记录"
  downstream_tasks:
