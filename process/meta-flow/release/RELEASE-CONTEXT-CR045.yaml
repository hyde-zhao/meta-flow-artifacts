release_scope:
  current_version: "0.4.0"
  target_version: "0.4.1"
  included_features:
    - "CR-aware checkpoint route planning"
    - "Explicit N/A versus WAIVED checkpoint semantics"
    - "Route-plan-driven post-approval state transitions"
  included_stories:
    - "CR045-S1"
  excluded_scope:
    - "Runtime execution, production operation, external writes and repository publication"
    - "Unrelated repository hygiene beyond the CP8 cache check"
  user_visible_changes:
    - "Process CRs now receive a deterministic checkpoint route derived from CR traits and gate profile."
    - "Non-applicable checkpoints are recorded as N/A instead of being represented as waivers."
    - "After an approval or pass-like result, state transition validation follows the route plan until the next required gate or an explicit stop reason."
  internal_changes:
    - "CP result dispatch and waiver consistency validation was tightened."
    - "Authorization and workflow-health stop reasons remain compatible with pass-like and BLOCKED decisions without accepting stale rework reasons."
  breaking_changes: []
  known_risks:
    - "CR045-RISK-RECOVERY-ORDERING: CP2 and CP5 were approved after historical CP6; the recovery history is preserved and was not backdated."
    - "CR045-PROVENANCE-LIMITATION: subagent execution was session-observed, but repository artifacts do not contain a platform-signed dispatch receipt; transferred to CR-A S01."

