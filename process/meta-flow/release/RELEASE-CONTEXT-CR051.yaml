source_gate: CP8

release_scope:
  current_version: "0.4.0"
  target_version: "0.5.0 (proposed; not materialized or published)"
  included_features:
    - project-first artifact routing and project-owned-path isolation
    - recoverable artifact worktree switch with capacity estimate and durable intent
    - heterogeneous source/artifact CR legs with typed worst-status aggregation
    - fail-closed completion selector persistence and CAS
    - read-only migration preflight manifest and handoff
  included_stories:
    - ST-AW-001
    - ST-AW-002
    - ST-AW-003
    - ST-AW-004
    - ST-AW-005
  excluded_scope:
    - real hosted remote, credentials, branch protection or publication
    - real project worktree/ref/branch switch outside temporary fixtures
    - main-to-integration or integration-to-main manual synchronization
    - real artifact migration, copy, move, delete or symlink relink
    - Windows native Git, durability, cross-process lock or no-follow pilots
    - source or artifact repository commit, push, merge or release
  user_visible_changes:
    - source repository and artifact repository now have explicitly different CR lifecycles
    - artifact worktree idles on project integration and uses project-namespaced short CR branches
    - overall CR completion requires both source and artifact legs to pass
  internal_changes:
    - project routing, worktree recovery, durable intent, typed leg lifecycle and aggregate selector modules
    - immutable read-only migration manifest with deny descendant and no-follow controls
  breaking_changes: []
  known_risks:
    - CR051-RISK-PARTIAL-INDEPENDENT-QA
    - DOC-CR051-CAPABILITY-REGISTRY-MISSING
    - CR051-RISK-REMOTE-UNVERIFIED
    - CR051-RISK-WINDOWS-NATIVE-PILOTS
    - R-AW004-LOCK-CRASH
    - R-AW005-DIR-ENUM-TOCTOU
    - CR051-RISK-REAL-MIGRATION-UNVERIFIED
    - CR051-RISK-MODULE-BOUNDARIES-MANIFEST

version_decision:
  current_version: "0.4.0"
  target_version: "0.5.0"
  version_applied: false
  change_type: MINOR
  compatibility: compatible
  reason: >-
    CR-051 adds a substantial project-first artifact lifecycle while retaining the source default-branch
    lifecycle and existing public workspace commands. 0.5.0 is a CP8 recommendation only; no package
    metadata, tag, commit or publication was authorized.

