repository_lifecycles:
  source_repository:
    baseline: default branch (main or master)
    cr_start: short CR branch from latest default branch
    cr_completion_target: default branch
    current_execution: not-authorized-unexecuted
  artifact_repository:
    shared_baseline: main retained
    project_idle_branch: projects/<project>/integration
    cr_start: project-namespaced short CR branch from latest project integration
    cr_completion_target: same project integration only
    shared_main_sync: manual outside CR in both directions
    current_execution: not-authorized-unexecuted

