  pending_human_decisions:
    - "DQ-CR173-001 effective-count estimand / non-alias boundary"
    - "DQ-CR173-002 CP3 method and input-contract obligation"
    - "DQ-CR173-003 typed_unavailable / blocked failure semantics"
    - "DQ-CR173-004 seven-field evidence schema and provenance"
    - "DQ-CR173-005 strategy-agnostic boundary"
    - "DQ-CR173-006 6/6 × 3/3 deterministic golden-vector acceptance"
    - "DQ-CR173-007 C1 consumer projection and claim ceiling"
    - "DQ-CR173-008 CR172 recovery and no-runtime relationship"
  non_authorized_items:
    - "real lake/NAS/provider/credential read or write"
    - "real producer binding or real strategy computation"
    - "specific strategy identity"
    - "runtime, QMT/broker, simulation, paper/live trading"
    - "aggregate, CR155 promotion, mature admission or Stage 3 readiness"
    - "publish, deploy or Git remote write"
  risk_acceptance_items:
    - "R-CR173-RAW-EFFECTIVE-ALIAS: independent schema/provenance and zero alias paths"
    - "R-CR173-METHOD-NONDETERMINISM: version/hash and 3/3 repeat"
    - "R-CR173-CONSUMER-OVERCLAIM: typed_unavailable + projection postcondition"
    - "R-CR173-STRATEGY-COUPLING: strategy-agnostic fixture-only contract"
    - "R-CR173-SCOPE-ESCAPE: deny-default operation counters all zero"
  open_questions:
