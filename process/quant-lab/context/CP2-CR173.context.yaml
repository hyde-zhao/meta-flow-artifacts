handoff:
  target_agent: "user-human-review"
  expected_output:
    - "approve：接受 DQ-CR173-001..008 的八项推荐值"
    - "修改: <DQ-ID>=<value>：只修改指定决策并触发增量重整"
    - "reject：保持 effective_trial_count typed_unavailable，不进入 CP3"
  exit_criteria:
    - "8/8 DQ 均明确批准、修改或拒绝"
    - "claim ceiling 和 no-runtime/no-real-data 边界保持不变"
    - "批准只解锁 CP3 solution-design，不解锁 Story、实现或运行"
  blocked_if_missing:
    - "任一 DQ 没有明确值"
    - "要求在 CP2 直接冻结算法但未提供可评审方法决策"
    - "任何真实数据、策略身份、runtime 或 write 授权被隐含加入"

