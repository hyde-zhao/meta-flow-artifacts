  exit_criteria:
    - "Architecture Gray Areas 3~4 个，advisor table 具备至少两套真实候选与切换条件。"
    - "REQ-009~015 7/7 和 UC-58 可追溯，至少 3 个关键场景模拟 PASS。"
    - "四组件数据 owner 唯一，依赖方向无环，禁止 direct-NAS runtime 与 GitHub 数据面扩大。"
    - "SignalBatch 只保留 8 字段边界；详细 exchange/intraday Story/模块/实现数量为 0。"
    - "empirical R 三路线和 FU-CR173-001 条件式前置无矛盾。"
    - "所有真实操作计数为 0；CP3 result PASS 且 blocker=0 才可发起人工门禁。"
