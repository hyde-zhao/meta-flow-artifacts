key_facts:
  scope_summary: "PATH-I 只冻结并以未来 repository-local fixture 验证 trial-return instrumentation、稳定 logical URI、研究机 local canonical→NAS verified replica→执行机 local immutable cache、六类逐动作授权和 empirical-R 分类合同；信号只保留执行机本地默认与 8 字段边界。"
  accepted_decisions:
    - "DQ-CR172-009~015 已由用户在 CP2 7/7 批准。"
    - "研究机本地目录是 active canonical；NAS 仅是 verified replica/backup/distribution；执行机 runtime 只消费本地 immutable materialization。"
    - "新 run 使用 multifactor-strategy-research/{run_id}；legacy stage3_mature_multifactor 只读不迁移。"
    - "六类真实动作分别授权；当前授权和执行均为 0/6。"
    - "FU-CR173-001 只阻断 positive empirical effective count/c1_computable；DQ-003 typed_unavailable 降级可继续设计。"
    - "SignalBatch 只冻结精确 8 字段；物理路径、状态机、ack、idempotency/replay、exchange 与 intraday 全部 deferred。"
  active_constraints:
    - "CP3 design-only：目录创建、runner 修改、真实 lake/NAS、runtime、trial-return/R、signal、migration、trading、publish/deploy、Git remote write 全部为 0。"
    - "logical URI + content hash 是跨机器身份；绝对挂载路径不得进入 canonical identity。"
    - "replica stale/partial/hash mismatch 和执行机 direct-NAS runtime read 必须 fail-closed。"
    - "不得把 CR-163 metadata/ref、layered forward returns 或 CR-173 已计算 R envelope 误写成 trial-return source。"
    - "CP8 最高 path_i_design_ready=true；stage3_entry_ready、c1_computable、real_data_authorized、multi_trial_runtime_authorized、signal_transport_authorized 均 false。"
  downstream_tasks:
    - "增量更新 BLUEPRINT.md、DOMAIN-MAP.md、DEPENDENCY-MAP.md，保留既有内容与修订记录。"
    - "生成 CR-specific PATH-I HLD 和 ARCHITECTURE-DECISION 文档。"
    - "前置完成 Architecture Gray Areas、advisor table、至少两套候选方案、Use Case trace 与 3 个关键场景模拟。"
    - "判定 HLD 是否需要拆分；不得把 deferred signal exchange 或 empirical methodology v2 设计偷渡进 PATH-I。"
    - "生成 CP3 自动预检 result 和 return summary；不得生成 Story/LLD/实现。"
  traceability:
    requirements: ["REQ-CR172-009", "REQ-CR172-010", "REQ-CR172-011", "REQ-CR172-012", "REQ-CR172-013", "REQ-CR172-014", "REQ-CR172-015"]
    use_cases: ["UC-58-CR172"]
    scenarios: ["SC-CR172-I01~I13", "SC-CR172-S01~S06", "SC-CR172-Q01~Q02"]
    stories: []
    features: ["PATH-I trial-return instrumentation", "artifact identity and replica flow", "per-action authorization", "empirical-R disposition", "signal boundary only"]

risks_and_decisions:
  pending_human_decisions:
    - "CP3 必须确认 HLD/ADR 中的模块边界、manifest/seal 顺序、授权判定点和 fail-closed 场景；不能重开已批准 CP2 范围。"
  non_authorized_items:
    - "任何代码/测试/fixture 实现（需未来 CP5）"
    - "目录创建、runner 默认值切换或 legacy migration"
    - "真实 data lake/NAS access、sync/pull/materialize、multi-trial runtime、trial-return/R computation"
    - "SignalBatch 生成/transport/ack/replay、QMT/trading、publish/deploy、Git remote write"
  risk_acceptance_items:
    - "R-CR172-REAL-R-DOMAIN-MISMATCH：positive empirical 由 FU-CR173-001 阻断或 DQ-003 降级。"
    - "R-CR172-RUNTIME-AUTHORIZATION-GAP：六类动作保持独立且当前 0/6。"
    - "R-CR172-SYNC-REPLICA-STALE：manifest/hash/atomic materialization 必须设计为 fail-closed。"
    - "R-CR172-SIGNAL-TRANSFER-AMBIGUITY：PATH-I 只冻结边界，详细交换 deferred。"
  open_questions:
    - "Architecture Gray Areas 形成的 CP3 DQ，必须在 CP3 Decision Brief 中由用户确认。"
  n_a_or_waived_items:
    - "Story、LLD、source/test implementation、真实环境验证在 CP3 均 N/A；无 waiver。"

