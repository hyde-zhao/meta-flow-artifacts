key_facts:
  scope_summary: "Design an auditable experiment-family lifecycle that declares before search, records trial/attempt/selection append-only, seals deterministic immutable manifests with supersession, instruments two producer chains/four mappings, and integrates lineage refs into existing admission consumers."
  accepted_decisions:
    - "Inventory is 2 deduplicated producer chains / CPI-CR163-001..004 4 mappings; S03 covers all four within the five-Story target."
    - "Different seed/parameters are trials; retry is an attempt; failed/cancelled/excluded declared trials remain in raw count and lineage."
    - "effective_trial_count remains typed_unavailable with empty ref/method; CR163 only makes C1 raw-lineage input ready."
    - "Sealed versions are immutable; correction only through append-only supersession preserving prior ref/hash/version chain."
    - "CR155 remains blocked; no historical family/trial reconstruction."
  active_constraints:
    - "Final object names may be frozen at CP3, but must cover Spec, Trial, Attempt, Selection, Manifest and Validation concepts."
    - "ExperimentManifest remains single-run; family lineage is a separate lifecycle connected via run_id, experiment_id and artifact refs."
    - "Use local deterministic JSON/JSONL conventions; no database, MLflow, external registry or shared runtime."
    - "present requires seal+completeness+reference+count+tamper checks; uninstrumented is typed_unavailable; invalid/incomplete/tampered is blocked."
    - "No source/test implementation, real data/runtime/credentials/trading/external write/statistical computation is authorized at CP3."
  downstream_tasks:
    - "Perform blueprint applicability and Architecture Gray Areas analysis."
    - "Compare at least two viable architectures and recommend the minimum contract-first append-only JSON/JSONL design."
    - "Define explicit producer, recorder, sealer/validator, manifest, single-run identity and admission-consumer integration contracts."
    - "Freeze count state machine, duplicate/retry semantics, incomplete/invalid transitions, seal/supersession and deterministic hash rules in ADRs."
    - "Simulate at least three key scenarios: happy-path seal/present, failure/retry/exclusion count, tamper/supersession/CR155 negative regression."
    - "Provide CP4 inputs for exactly five Stories, including S03 all-four-mapping coverage, dependencies, likely file owners and LLD policy recommendations, without writing DEVELOPMENT-PLAN."
    - "Return CP3 precheck inputs and any unresolved architecture DQ to host-orchestrator; do not open the formal CP3 gate."
  traceability:
    requirements: ["REQ-CR163-001", "REQ-CR163-002", "REQ-CR163-003", "REQ-CR163-004", "REQ-CR163-005", "REQ-CR163-006", "REQ-CR163-007", "REQ-CR163-008"]
    use_cases: ["UC-58-CR163"]
    scenarios: ["SC-CR163-P01", "SC-CR163-P02", "SC-CR163-P03", "SC-CR163-N01", "SC-CR163-N02", "SC-CR163-B01", "SC-CR163-B02", "SC-CR163-F01", "SC-CR163-R01", "SC-CR163-T01", "SC-CR163-A01", "SC-CR163-G01"]
