    - "Final object names and artifact paths are CP3 decisions, not CP2 implementation guesses."
  n_a_or_waived_items:
    - "Real ML/event runner instrumentation is N/A because current paths are fixture/static adapters; shared producer contract and compatibility tests remain in scope."

handoff:
  target_agent: "meta-pm"
  expected_output:
    - "Incremental product baseline revisions for all eight affected docs"
    - "Candidate-producing entrypoint inventory with explicit included/excluded paths and evidence"
    - "process/discussions/CP2-CR163-SCENARIO-DISCUSSION-LOG.md"
    - "process/checks/CP2-CR163-DISCUSSION-CHECKPOINT.json"
    - "process/checks/CP1-CR163-TRIAL-LINEAGE-INSTRUMENTATION-USE-CASE-COMPLETENESS.result.json"
    - "process/handoffs/CR163-CP2-META-PM-RETURN-SUMMARY.md"
  exit_criteria:
    - "P0 scenarios, entrypoint inventory, quantitative AC, exclusions and CR155 negative regression are traceable."
    - "No implementation, Story decomposition, LLD or runtime action occurs."
    - "All OPEN items are classified; host-orchestrator can prepare CP2 Decision Brief."
  blocked_if_missing:
