key_facts:
  scope_summary: "Declare experiment families before search, automatically record trial/attempt/selection lineage append-only, seal deterministic manifests, validate completeness/tamper/counts, and expose lineage availability/ref to existing admission consumers."
  accepted_decisions:
    - "Use one formal CR163 with a target of five Stories; do not split the goal package into multiple CRs."
    - "Use standard architecture-major flow with CP2/CP3/CP5/CP8 human gates and independent meta-qa-critical CP7."
    - "ExperimentManifest remains a single-run object; family lineage is a separate lifecycle connected by run_id, experiment_id and artifact refs."
    - "Availability remains present/typed_unavailable/not_applicable_with_reason/blocked; no new parallel gate family."
    - "CR155 is negative regression only and must remain blocked."
  active_constraints:
    - "Family spec exists before first trial; failed/cancelled/excluded trials remain in lineage."
    - "Retries use distinct attempt_id without increasing raw_trial_count; different seeds remain distinct trials."
    - "Seal is immutable; later corrections supersede and preserve prior version."
    - "effective_trial_count stays typed_unavailable with empty ref/method in this CR."
    - "No real lake/NAS/provider/credential/runtime/trading/broker/external-framework/remote-write/publish action is authorized."
  downstream_tasks:
    - "Perform Scenario Gray Areas discussion using at least one SGQ interaction or return a focused question batch to the host."
    - "Create and freeze a named candidate-producing entrypoint inventory with 100% P0 coverage semantics."
    - "Incrementally update USE-CASES, REQUIREMENTS, SCENARIOS, TEST-MATRIX, STORY-MAP, MVP-SCOPE, RELEASE-SLICES and BACKLOG with revision records."
    - "Produce CP1 result, CP2 precheck inputs, discussion log/checkpoint, and a return summary for host-orchestrator."
  traceability:
    requirements: ["CR163 family lifecycle", "trial instrumentation", "search lineage", "count semantics", "manifest production", "existing-gate integration"]
    use_cases: ["UC-58", "UC-59 compatibility-only", "UC-60 compatibility-only"]
    scenarios: ["pre-search declaration", "retry/seed/duplicate", "failure/cancel/exclude", "seal/supersede/tamper", "missing instrumentation", "CR155 negative regression"]
    stories: ["S01 contract+validator", "S02 recorder+seal+hash", "S03 mature multifactor entrypoint", "S04 admission integration", "S05 integrity/recovery/tamper/CR155 regression"]
    features: ["experiment-family-lineage", "strategy-admission-evidence"]

risks_and_decisions:
  pending_human_decisions:
    - "CP2 must confirm the frozen entrypoint inventory, count semantics, availability semantics, quantitative AC and exclusions."
  non_authorized_items:
    - "statistical corrections or effective-trial computation"
    - "historical lineage backfill"
    - "real data, runtime, provider, credential, NAS, broker, trading, publish or remote write"
  risk_acceptance_items: []
  open_questions:
