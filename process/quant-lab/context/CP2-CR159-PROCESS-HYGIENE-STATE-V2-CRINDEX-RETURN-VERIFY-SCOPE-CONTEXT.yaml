    alternatives:
      - "扩大 B 到全局 187 ERROR 归一化（含 57 missing summary_ref + 44 种 invalid status 映射）。"
      - "只做 A（STATE slim），B/C 全部 deferred。"
    impact: "推荐方案 scoped 可执行且不漏修 B1 明确项；扩大方案需逐 CR 语义判断，超出 hygiene 范围；只做 A 遗留 authz L2 + CR-158。"
  - id: DQ-CP2-CR159-STATE-UNKNOWN-FIELDS
    decision_type: implementation
    question: "STATE.current.json 6 unknown field + source_refs 超 budget 如何处置？（state-router 契约依赖 4 字段）"
    recommendation: "slim --apply 归档 source_refs + workflow_health；删除 stale phase（与 current_phase 冲突）；保留 current_agent/last_action/cr_tracking_ref/cr_ledger_ref（state-router/SKILL.md:104,114,290 + STATE-TEMPLATE.md:7,11,318,319 契约依赖），接受 4 residual WARN documented + FU-CR159-002 重访（schema allowlist 扩展）。目标：source_refs budget resolved + phase deleted + 4 residual WARN documented，非全局 0 WARN。"
    alternatives:
      - "扩展 STATE v2 schema/check allowlist 纳入 4 字段（需改 meta-flow 工具，转 FU-CR159-002）。"
      - "删除 4 字段 + 同步改 state-router/SKILL.md + STATE-TEMPLATE.md（破坏运行态契约，高风险，不推荐）。"
    impact: "推荐方案不破坏运行态契约，诚实记录 residual WARN；A 超出本 CR 范围转 follow-up；B 破坏 state-router 契约，删除会被下一轮补回。"
  - id: DQ-CP2-CR159-AUTHZ-L2-SEMANTICS
    decision_type: implementation
    question: "CR-151/152/153/154 required_evidence 含 real_lake_validation 与 NO_REAL_LAKE_READ_OR_WRITE 冲突，如何修正？"
    recommendation: "修正 required_evidence: real_lake_validation → static_fixture_only_validation，匹配实际 local/static/fixture-only 验证模式；evidence 标签数据修正，非能力变更，不重开 closed CR；修正前备份 + mapping table。"
    alternatives:
      - "保留 real_lake_validation 标注 evidence_status=deferred。"
      - "移除 real_lake_validation 不替换。"
    impact: "推荐方案与实际验证模式一致且 B1 scoped 0 ERROR；A 保留矛盾语义；B 损失追溯。"
  - id: DQ-CP2-CR159-CR158-STATUS
    decision_type: implementation
    question: "CR-158 lifecycle_status/status=closed-current-delivery 无效，修正为什么值？"
    recommendation: "修正为 closed-current-delivery-ready-with-risk，对齐 CR-156（CR-158 同为 READY_WITH_RISK 闭环）。"
    alternatives:
      - "修正为 closed（更简）。"
      - "保留并接受 ERROR（转 B2 deferred）。"
    impact: "推荐方案与 CR-156 一致且准确；A 丢失 ready_with_risk 语义；B 把 CR-158 转 deferred，不修。"
  - id: DQ-CP2-CR159-CP8-SCOPED-CHECK
    decision_type: implementation
    question: "CP8 验收是全局 cr check 0 ERROR，还是 scoped（B1 0 ERROR + B2 deferred）？"
    recommendation: "CP8 scoped：B1（authz L2 + CR-158 + CR-159 item）0 ERROR；B2 全部转入 FU-CR159-001 candidate；不承诺全局 0 ERROR。"
    alternatives:
      - "CP8 全局 0 ERROR（扩大 B 到 187 ERROR 修正）。"
      - "CP8 不做 cr check 验收，只做 state check + story tooling。"
    impact: "推荐方案可执行且诚实；A 需逐 CR 语义判断，工作量大；B 丢失 cr 治理验收。"
  - id: DQ-CP2-CR159-CP6-CP7-CONDITIONAL
    decision_type: implementation
    question: "CP6/CP7 是 blanket WAIVED 还是条件路由？"
    recommendation: "条件路由：子项 C 探测若无代码变更 → CP6 N/A、CP7 由 CP8 统一验证；若需增强 meta-flow story 工具 → 生成轻量 CP6 implementation evidence + CP7 verification evidence（回归 CR156/157/158 packet，0 新失败）再进 CP8。"
    alternatives:
      - "blanket WAIVED（不论子项 C 结果都跳过 CP6/CP7）。"
      - "一律走完整 CP6/CP7（即使无代码变更）。"
    impact: "推荐方案匹配子项 C 不确定性；A 可能漏工具实现验证；B 对无代码变更场景过重。"
  - id: DQ-CP2-CR159-NO-REMOTE-RELEASE-RUNTIME
    decision_type: security
    question: "确认 CR-159 approval 不授权 Git remote write、true release、publish、runtime、真实数据、凭据、NAS/provider、broker、trading、catalog/store/registry 写入、外部框架运行、重开 closed CR-151/152/153/154/158，也不承诺全局 cr check 0 ERROR？"
    recommendation: "确认不授权边界 + 不承诺全局 0 ERROR；后续只允许本地 process/state/CR-INDEX/tooling hygiene 与路标 append-only 回写。"
    alternatives:
      - "允许后续单独本地 commit preparation gate（仍禁止 remote write）。"
      - "延后全部 closure 到 release-readiness CR。"
    impact: "推荐方案风险最低；A 减少等待但需新门禁；B 审计更重。"

