decision_items:
  - id: DQ-CP2-CR159-SCOPE
    decision_type: scope
    question: "批准 CR-159 作为三子项 compact local hygiene consolidation（A: STATE v2 slim 0 WARN + B1: CR-INDEX scoped 数据修正 + C: return/verify 探测）+ B2 deferred FU-CR159-001 + CP8 路标 v1.3 回写？"
