scope_summary:
  objective: Create one auditable daily multifactor baseline strategy artifact, based on a simple non-optimal factor combination and explicit admission evidence.
  in_scope:
    - daily multifactor baseline strategy, simple factor combination, non-optimal and non-return-promising
    - strategy artifact with strategy_id, universe ref, factor spec, signal spec, portfolio policy, rebalance policy, cost/slippage policy, backtest refs, experiment refs, report refs and evidence refs
    - historical backtest using CR155-approved local governed lake/current truth readonly input
    - OOS/walk-forward validation with split, purge/embargo, rerun id and core metrics
    - statistical admission gate status: pass, fail or needs_review, with auditable reasons
    - cross-strategy reliability gate status consuming CR154 semantics
    - admission package with paper_candidate true/false, reason, blockers, risks and non-authorized boundary
    - two reruns with core metrics consistency evidence covering return, drawdown, turnover, cost, capacity/liquidity summary and gate status
  deferred:
    - lake writes or catalog pointer mutation
    - NAS/provider/credential/runtime/trading/broker operations
    - production deployment, publish or true release execution
    - multi-strategy portfolio, ML strategy artifact or event-driven strategy artifact expansion
  out_of_scope:
    - credential or .env read
    - real lake write
    - NAS read/write/sync/restore/chmod/chgrp/metadata normalization
    - provider fetch
    - QMT/MiniQMT/xtquant/gateway runtime
    - simulation/paper/live/trading runtime
    - broker read/write/submit/cancel/real account query
    - external framework clone/install/run
    - Git remote write
    - catalog pointer mutation
    - feature store / label store / event store / model registry / prediction store writes
    - true release execution / production deployment / publish
