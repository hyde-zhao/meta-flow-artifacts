key_facts:
  scope_summary: "CR-172 新增 PATH-I：CP3 只冻结 trial-return/R instrumentation、研究机 active canonical、NAS verified replica、执行机 local materialization、stable logical URI、四组件部署与六类授权合同；DQ-015 仅保留信号边界和 8 个最小字段；不授权实现、真实运行或同步。"
  accepted_decisions:
    - "原 DQ-001~008 与 PATH-B 历史批准继续有效。"
    - "CR-173 仅完成 offline methodology，不能解除真实 trial-return/runtime 缺口。"
    - "新运行不得继续使用 stage3_mature_multifactor 目录名；历史目录保留只读审计。"
    - "用户指定部署由研究机、执行机（交易机）、NAS、GitHub 四组件组成。"
    - "研究机本地目录是实际运行与 active canonical；NAS 是同步副本/备份/分发面；执行机按需从 NAS 拉取并校验到本地后消费。"
    - "交易信号默认由执行机本地生成；PATH-I 只冻结低频/EOD immutable batch 的 8 字段边界，物理路径/七级状态机/ack/idempotency/replay deferred，intraday transport 另立 CR。"
    - "FU-CR173-001 不阻止 DQ-003 typed_unavailable 降级后的 PATH-C/A 设计，但阻断 empirical effective count available 与 c1_computable=true。"
  active_constraints:
    - "real lake/NAS read/write、runtime、R computation、migration、trading、publish、Git remote write 均未授权。"
    - "lineage identity 使用 logical URI + content hash，不能依赖绝对挂载路径。"
    - "执行机不得直接从研究机或 NAS 工作路径运行；只消费经 manifest/hash 校验的本地 materialization。"
    - "SignalBatch 不得携带 credential、account secret 或 broker order command。"
    - "CP3 不创建目录、不改 runner、不写 NAS、不跑 multi-trial、不传信号；CP5 未来只能单独批准 repository-local code/test/fixture。"
