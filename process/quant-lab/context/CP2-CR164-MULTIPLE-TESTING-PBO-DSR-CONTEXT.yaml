key_facts:
  scope_summary: "Define an MVP computable-evidence pipeline for multiple-testing and backtest-overfitting controls using sealed CR163 experiment-family lineage, while preserving CR161 typed-unavailable/blocked semantics whenever inputs are insufficient."
  accepted_decisions:
    - "FU-CR161-002 is activated as formal CR-164; CR-161 and CR-163 remain closed baselines."
    - "Use standard architecture-major flow with CP2/CP3/CP5/CP8 human gates."
    - "Story/LLD/implementation are blocked until CP2 approval; source implementation remains blocked until CP5 approval."
    - "CR164 will obtain a fresh independent CP7 and does not reuse CR161's waived CP7 result as proof."
    - "No real research, production dataset, NAS, provider, credential, runtime, broker, trading, publish or remote-write action is authorized."
  repository_facts:
    - "CR163 exposes sealed family lineage and raw_trial_count; effective_trial_count remains typed_unavailable."
    - "strategy_admission_statistical_gate validates report shapes and thresholds but does not establish their computation provenance."
    - "cross_strategy_reliability_gates requires FDR/BH, WRC/SPA, PBO/CSCV and DSR/deflation references and valid trial-count provenance for positive claims."
    - "anomaly_multiple_testing contains an existing Bonferroni/BH implementation that may be reusable only after scope/architecture review."
  downstream_tasks:
    - "Run Scenario Gray Areas discussion and return a compact SGQ batch through the host if decisions remain."
    - "Incrementally revise all eight product baselines with revision records; never replace the documents wholesale."
    - "Freeze CP2-level method scope, personas/journey, evidence inputs, insufficiency behavior, quantitative acceptance criteria, exclusions and non-authorization."
    - "Separate MVP requirements from deferred methods and from future real-run authorization."
    - "Produce CP1 result, CR164 discussion log/checkpoint and a return summary; do not open CP2 yourself."
  traceability:
    requirements: ["method-scope", "input-sufficiency", "lineage-binding", "determinism", "fail-closed", "consumer-integration", "numerical-boundaries"]
    use_cases: ["UC-58 multifactor P0", "UC-59 ML compatibility", "UC-60 event compatibility"]
    scenarios: ["complete sealed family", "missing/partial family", "method disagreement", "low sample/fold count", "NaN/Inf/degenerate inputs", "tamper/hash mismatch", "CR155 negative regression"]

risks_and_decisions:
  pending_human_decisions:
    - "Which method set is mandatory in the MVP: BH only versus BH plus WRC/SPA/PBO/DSR."
    - "Whether effective-trial computation belongs in the same slice or remains typed_unavailable until a separately bounded method is approved."
    - "Minimum sample, trial, split/fold and return-path sufficiency thresholds for each selected method."
    - "Whether ML/event adapters are current implementation scope or compatibility-only consumers."
  non_authorized_items:
