    reason: "人类摘要，不是机器状态入口"
  - path_or_pattern: "process/archive/**"
    reason: "历史归档不属于 CP2 默认上下文"
  - path_or_pattern: "process/discussions/**"
    reason: "讨论日志只在审计/恢复时读取"
  - path_or_pattern: "process/stories/**"
    reason: "CP2 前禁止 Story/LLD/implementation"
  - path_or_pattern: "docs/design/HLD.md"
    reason: "CP2 未批准前禁止 HLD/CP3"
  - path_or_pattern: "完整 CR-166 Story/LLD/测试报告"
    reason: "CR166 summary、release context 与代码事实已足够"
  - path_or_pattern: "完整会话 transcript"
    reason: "不得作为下游默认输入"

key_facts:
  scope_summary: "建立 fixture/static-only C3 Economic Cost / Slippage / Impact approximation typed evidence producer foundation；复用 CR166 neutral envelope，不连接真实数据，不启动 Stage 3。"
  accepted_decisions:
    - "Gate 4 是 C3+C4 联合门禁，不是 C3-only。"
    - "C3 必须输出 cost_underestimation_status 与 structured limitations。"
    - "fixture 语义为 daily multifactor synthetic + daily/ML multi-strategy-type compatibility。"
    - "currency/price-basis/calendar 仅在跨字段不一致且无显式转换声明时 fail-closed。"
    - "用户批准 Host Orchestrator 执行 meta-pm inline-fallback；未使用子 Agent。"
  active_constraints:
    - "typed C3 component/schema=1/1"
    - "input field families=9/9"
    - "P0 C3 input fail-closed=10/10；另有 Gate 4 projection guard 场景 1 个"
    - "fixture families=2/2"
    - "10 deterministic runs -> 1 canonical hash"
    - "C3-to-Gate-4 projection=1；C4 unavailable=three refs absent-no-na-reason；field/generic reason escape=projection BLOCKED/REJECTED；canonical Gate4/aggregate changes=0；C4 calculator=0；capacity/aggregate PASS=0"
    - "CR168 scenarios=17（P0=16，P1=1）；matrix=17/17"
    - "Stage2=true；Stage3=false；真实 TCA/calibration/data/runtime=false"
    - "CP2 前不得进入 HLD/Story/LLD/implementation/verification"
  downstream_tasks:
    - "仅在 CP2 approved 后，生成 meta-se capsule-first handoff 并进入 CP3 solution-design。"
    - "CP3 需冻结 9-family schema、static approximation method、C3/C4 header、availability→Gate 4 flat-payload mapping 和 projection reason-key denylist。"
    - "CP3 需处理 capability-registry-missing、三个 required_evidence kind、impact-specific n/a-with-reason 与 component/envelope hash domain；不得新建平行 registry 或模糊跨策略 full-hash QAC。"
  traceability:
    requirements: ["REQ-CR168-001..009"]
    use_cases: ["UC-58-CR168"]
    scenarios: ["SC-CR168-P01..E01（17项；含新增 SC-CR168-B02）"]
    stories: []
    features: ["strategy-evidence-envelope", "cross-strategy-reliability-gates"]

