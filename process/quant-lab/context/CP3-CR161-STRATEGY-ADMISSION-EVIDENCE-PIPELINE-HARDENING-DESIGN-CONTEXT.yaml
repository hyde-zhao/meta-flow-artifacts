approved_cp2_decisions:
  - id: DQ-CP2-CR161-WAVE1-TRIAL-LINEAGE-SOURCE
    selected: contract-first
    design_requirement: Define ExperimentFamilyManifest and availability semantics; missing lineage becomes typed_unavailable.
  - id: DQ-CP2-CR161-TYPED-UNAVAILABLE-FAIL-CLOSED
    selected: fail-closed
    design_requirement: Mandatory missing evidence blocks statistical significance, robustness, paper candidate and production-like claims.
  - id: DQ-CP2-CR161-CR155-NEGATIVE-REGRESSION
    selected: blocked sample only
    design_requirement: CR155 remains blocked_admission_failed and paper_candidate=false; do not reconstruct missing historical C1/C2 facts.
  - id: DQ-CP2-CR161-FOLLOWUP-SPLIT
    selected: forward instrumentation and impact/capacity implementation deferred
    design_requirement: Current slice is design-only contract-first; CP4/CP5/CP6 are N/A unless CP3 explicitly reroutes with user approval.
  - id: DQ-CP2-CR161-AUTHORIZATION-BOUNDARY
    selected: no new runtime/data/implementation authorization
    design_requirement: No new real lake read/write, runtime, broker, provider, credential, external framework, Git remote write or publish.
design_musts:
  evidence_object_coverage_matrix:
    required: true
    objects:
      - ExperimentFamilyManifest
      - MultipleTestingEvidence
      - DataSnoopingEvidence
      - OverfitRiskEvidence
      - WalkForwardEvidence
      - EconomicCostEvidence
      - CapacityLiquidityEvidence
    required_columns:
      - purpose
      - producer
      - consumer
      - mandatory_for_claim_tiers
      - availability_status
      - fail_closed_effect
      - current_slice_delivery
      - follow_up_ref
      - CR151_CR154_integration_mode
      - CR155_negative_regression_expectation
  availability_status_state_machine:
    statuses:
      - present
      - typed_unavailable
      - not_applicable_with_reason
      - blocked
  claim_tier_decision_table:
    tiers:
      - exploratory
      - candidate
      - paper_candidate
      - production_like
    requirement: typed_unavailable may allow low-grade exploratory documentation only when explicitly labelled; it must block paper_candidate and production_like claims.
  integration_boundary:
    requirement: Extend CR151/CR154 evidence refs/summaries; do not create a parallel strategy admission gate family.
  first_slice_truthfulness:
    requirement: State clearly that this CR first slice delivers typed_unavailable fail-closed contract semantics, not computable FDR/PBO/DSR, fold-level OOS, real TCA, or capacity implementation.
  follow_up_candidates:
    - id: FU-CR161-001
      title: Research-engine trial lineage instrumentation
    - id: FU-CR161-002
      title: Multiple testing / PBO / DSR computable evidence implementation
    - id: FU-CR161-003
      title: Walk-forward fold-level metrics and OOS evidence computation
    - id: FU-CR161-004
      title: Economic cost / impact approximation implementation
    - id: FU-CR161-005
      title: Capacity / liquidity sizing and alpha decay implementation
authorization_boundary:
  not_authorized:
    - source_or_test_implementation_before_CP5_approval
    - research_engine_forward_instrumentation_in_current_slice
    - simulation_or_paper_run
    - live_or_trading_runtime
