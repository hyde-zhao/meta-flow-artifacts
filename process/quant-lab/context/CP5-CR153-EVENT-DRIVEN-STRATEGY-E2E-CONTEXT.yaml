      owner_scope: "Event-to-signal/order-intent trace refs and exact CR153 evidence/release wording targets or explicit N/A."

cp5_attention_items:
  - id: "CP5-FOCUS-CR153-001"
    story: "CR153-S01-event-research-time-pit-contracts"
    requirement: "Make event_available_at, decision_time and revision policy fail-closed behavior exact; availability cannot be inferred."
  - id: "CP5-FOCUS-CR153-002"
    story: "CR153-S02-event-study-method-test-slots"
    requirement: "Keep multiple_testing_or_data_snooping_slot mandatory and explicit; algorithms remain slot-only unless separately authorized."
  - id: "CP5-FOCUS-CR153-003"
    story: "CR153-S04-event-admission-gate-adapter"
    requirement: "Event gate PASS must not imply feed, runtime, paper, live, broker or trading readiness."
  - id: "CP5-FOCUS-CR153-004"
    story: "CR153-S05-event-trace-evidence-wording"
    requirement: "Technical note must enumerate exact CR153 return/evidence/release wording artifacts or mark each artifact family N/A; broad process/returns/*, process/evidence/* or docs/release/* ownership is not sufficient for implementation."
  - id: "CP5-FOCUS-CR153-005"
    story: "CR153-S02-event-study-method-test-slots / CR153-S03-event-bias-risk-audit-slots"
    requirement: "LLDs must define a non-overlapping field partition in engine/event_strategy_contracts.py and the shared test file: S02 owns method/test family/multiple-testing fields only; S03 owns bias/CV/universe PIT audit fields only."

shared_field_partition:
  shared_module: "engine/event_strategy_contracts.py"
  shared_test_file: "tests/research/test_event_driven_strategy_e2e_contracts.py"
  s02_owned_fields:
    - "EventStudyMethodSpec"
    - "estimation_window"
    - "event_window"
    - "normal_return_model"
    - "return_horizon"
    - "CAR / BHAR / calendar-time method slots"
    - "EventStudyTestReport test family slots"
    - "multiple_testing_or_data_snooping_slot"
    - "family_id"
    - "tested_window_count"
    - "correction_method"
    - "adjusted_p_value"
  s03_owned_fields:
    - "overlap report slot"
    - "cluster report slot"
    - "endogeneity_treatment_slot"
    - "event CV split audit refs"
    - "universe_pit_audit"
    - "capacity / impact / regime / reconciliation deferred refs"
  rule: "S02 must treat S03 fields as out of scope. S03 must treat S02 fields as read-only inputs. CP5 blocks overlapping field ownership."

authorization_boundary:
  local_static_fixture_only: true
  source_implementation_before_cp5_approval: false
  real_event_feed_allowed: false
  live_listener_allowed: false
  real_lake_or_nas_allowed: false
  provider_fetch_allowed: false
  credential_read_allowed: false
  qmt_runtime_allowed: false
  broker_or_order_flow_allowed: false
  event_store_catalog_registry_write_allowed: false
  external_framework_run_allowed: false
  real_data_validation_allowed: false

downstream_tasks:
  - "Generate S01-S04 full LLDs and S05 technical-note."
  - "Run CP5 auto precheck after design evidence exists."
  - "Generate CP5 human gate draft with Decision Brief and pending decision list."
  - "Stop at CP5 pending review; do not implement source code."

risks_and_decisions:
  - "Fixture/static validation must not be represented as real feed, alpha, runtime readiness or trading readiness."
  - "Event metadata must not be represented as event store/catalog/model registry publication."
  - "S02/S03 field ownership overlap is a CP5 blocker."
  - "S05 broad release ownership without exact CR153 artifact targets is a CP5 blocker."
  - "Full CV, survivorship, capacity, impact, regime and reconciliation remain CR154/deferred."

token_control:
  max_source_files_per_story: 8
  full_doc_read_policy: "Only read full upstream docs when the context capsule or Story card is insufficient, a conflict is found, or a CP5 reviewer needs audit detail."
  read_expansion_log_required: true

