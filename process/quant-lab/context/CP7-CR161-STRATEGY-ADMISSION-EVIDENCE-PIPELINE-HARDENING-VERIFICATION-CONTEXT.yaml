validation_scope:
  validation_mode: review-only
  sut_type: design-only-contract
  story_id: CR161-DESIGN-ONLY
  in_scope:
    - Verify CP3 HLD and ADR cover all 7 evidence objects explicitly.
    - Verify typed_unavailable fail-closed claim-tier semantics are reviewable and no-overclaim.
    - Verify CR151/CR154 integration avoids a parallel CR161 gate family.
    - Verify CR155 remains blocked negative regression only.
    - Verify CP4/CP5/CP6 are N/A because no Story/LLD/implementation route was selected.
    - Verify follow-up split FU-CR161-001 through FU-CR161-005 is explicit.
    - Verify no unauthorized implementation, runtime, data, credential, external framework, Git remote or publish action occurred.
  out_of_scope:
    - Compute FDR, WRC/SPA, PBO/CSCV, DSR, fold-level OOS, real TCA, market impact, capacity sizing or alpha decay.
    - Instrument research engine trial lineage.
    - Remediate CR155 or reconstruct historical evidence.
    - Modify source code or tests.
verification_musts:
  - id: VM-CR161-001
    requirement: Seven-object matrix covers ExperimentFamilyManifest, MultipleTestingEvidence, DataSnoopingEvidence, OverfitRiskEvidence, WalkForwardEvidence, EconomicCostEvidence and CapacityLiquidityEvidence.
  - id: VM-CR161-002
    requirement: typed_unavailable blocks statistical significance, robustness, paper_candidate and production_like claims when evidence is mandatory.
  - id: VM-CR161-003
    requirement: Current slice is explicitly not computable FDR/PBO/DSR, fold-level OOS, real TCA or capacity implementation.
  - id: VM-CR161-004
    requirement: CR151/CR154 integration is through evidence refs/summaries; no parallel gate family.
  - id: VM-CR161-005
    requirement: CR155 remains blocked_admission_failed and paper_candidate=false.
  - id: VM-CR161-006
    requirement: CP4/CP5/CP6 N/A route is justified by CP3 design-only approval.
  - id: VM-CR161-007
    requirement: No unauthorized operations or code/test changes occurred.
