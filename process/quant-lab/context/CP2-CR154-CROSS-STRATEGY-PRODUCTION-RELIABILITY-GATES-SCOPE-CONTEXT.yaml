    source: CP2 review finding and docs/design/STRATEGY-E2E-FRAMEWORK-REVIEW-2026-07-01.md
    applies_to:
      - DQ-CP2-CR154-BACKTEST-TRAP-GATE
      - DQ-CP2-CR154-CV-GOVERNANCE
      - DQ-CP2-CR154-ADMISSION-GATE-DEFAULT-POLICY
