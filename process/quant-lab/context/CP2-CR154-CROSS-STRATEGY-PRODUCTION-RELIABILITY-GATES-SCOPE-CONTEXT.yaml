scope_summary:
  objective: Start local/static/fixture cross-strategy production reliability gates after CR153 Event-Driven Strategy E2E first-wave closure.
  in_scope:
    - backtest trap gate covering lookahead, survivorship, data snooping, regime overfit and cost underestimation
    - CP3 statistical reliability artifact contract for multiple-testing correction, FDR/BH, White Reality Check / Hansen SPA, PBO / CSCV, DSR / Sharpe or IC deflation, trial count / effective trials, blocked claims and release-blocking reason
    - cross-strategy walk-forward / OOS / purged-embargo governance
    - survivorship-free universe / PIT universe gate
    - capacity / market impact / liquidity sizing contracts
    - regime / attribution / reconciliation slots as structured contracts
    - CR151 / CR152 / CR153 admission gate default-required or release-blocking policy
  deferred:
    - real market impact calibration or real TCA
    - true paper/live/broker reconciliation
    - real lake / feature store / event store / model registry integration
    - NAS shared current truth or provider catalog execution
    - QMT / MiniQMT / xtquant / gateway runtime
    - live event listener / real event feed / real order flow
    - FU-CR152-001 test taxonomy / provenance hygiene
  out_of_scope:
    - real lake read or write
    - NAS access, sync, restore, chmod, chgrp or metadata normalization
    - provider fetch
    - QMT / MiniQMT / xtquant / gateway runtime
    - simulation / paper / live / trading runtime
    - live event listener
    - broker read/write/submit/cancel/real account query
    - credential or .env read
    - external framework clone/install/run
    - Git remote write
    - catalog pointer mutation
    - feature store / label store / event store / model registry / prediction store writes
    - real event feed execution
    - real order flow
    - real data validation
    - real reconciliation
    - true release execution / production deployment / publish
