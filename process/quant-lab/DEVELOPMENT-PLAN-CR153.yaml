      - "CR153-S03-event-bias-risk-audit-slots"
      - "CR153-S04-event-admission-gate-adapter"
      - "CR153-S05-event-trace-evidence-wording"

lld_design_batch:
  batch_id: "CR153-EVENT-DRIVEN-STRATEGY-E2E-BATCH-A"
  status: "pending-cp5"
  cp5_manual_review: "process/checkpoints/CP5-CR153-EVENT-DRIVEN-STRATEGY-E2E-LLD-BATCH.md"
  policy: "S01-S04 require full-lld; S05 requires technical-note. CP5 must review all design evidence together before implementation."
  stories:
    - "CR153-S01-event-research-time-pit-contracts"
    - "CR153-S02-event-study-method-test-slots"
    - "CR153-S03-event-bias-risk-audit-slots"
    - "CR153-S04-event-admission-gate-adapter"
    - "CR153-S05-event-trace-evidence-wording"
  cp5_attention_items:
    - id: "CP5-FOCUS-CR153-001"
      story: "CR153-S01-event-research-time-pit-contracts"
      requirement: "Make event_available_at, decision_time and revision policy fail-closed behavior exact; availability cannot be inferred."
    - id: "CP5-FOCUS-CR153-002"
      story: "CR153-S02-event-study-method-test-slots"
      requirement: "Keep multiple_testing_or_data_snooping_slot mandatory and explicit; algorithms remain slot-only unless separately authorized."
    - id: "CP5-FOCUS-CR153-003"
      story: "CR153-S04-event-admission-gate-adapter"
      requirement: "Event gate PASS must not imply feed, runtime, paper, live, broker or trading readiness."
    - id: "CP5-FOCUS-CR153-004"
      story: "CR153-S05-event-trace-evidence-wording"
      requirement: "Technical note must enumerate exact CR153 return/evidence/release wording artifacts or mark each artifact family N/A; broad process/returns/*, process/evidence/* or docs/release/* ownership is not sufficient for implementation."
    - id: "CP5-FOCUS-CR153-005"
      story: "CR153-S02-event-study-method-test-slots / CR153-S03-event-bias-risk-audit-slots"
      requirement: "LLDs must define a non-overlapping field partition in engine/event_strategy_contracts.py and the shared test file: S02 owns method/test family/multiple-testing fields only; S03 owns bias/CV/universe PIT audit fields only."

parallel_policy:
  max_parallel_lld: 2
  max_parallel_dev_after_cp5: 1
  max_parallel_verification_after_cp6: 2
  same_file_merge_rule: "S01, S02 and S03 may share event contract modules and tests; S01 time/PIT fields must freeze before S02/S03. S02 owns method/test family/multiple-testing fields only; S03 owns bias/CV/universe PIT audit fields only. CP5 must block overlapping field ownership."
  event_gate_rule: "S04 depends on S01-S03 and owns event gate status/package linkage; any semantic ambiguity returns to CP5 design."
  evidence_wording_rule: "S05 consolidates trace/evidence/release wording after S01-S04 design decisions are stable; its technical note must list exact CR153 artifact paths or explicit N/A for return packet, evidence index, CP7 wording, CP8/release context and release notes."

waves:
  - wave: "CR153-W1-EVENT-PIT"
    objective: "Define EventResearchSpec, time semantics and EventRevisionPITGate."
    parallel_lld: false
    parallel_dev_after_cp5: false
    entry_conditions:
      - "CR153 CP3 approved"
      - "FEAT-03 CR153 increment recorded in Feature Design Matrix"
    stories:
      - story_id: "CR153-S01-event-research-time-pit-contracts"
        title: "Event research time semantics and PIT revision gate"
        priority: "P0"
        status: "lld-ready-for-review"
        depends_on: []
        primary_files:
          - "engine/research_production_contracts.py"
          - "tests/research/test_event_driven_strategy_e2e_contracts.py"
        merge_owner: "CR153-S01-event-research-time-pit-contracts"
        lld_gate:
          required: true
          required_level: "full-lld"
          status: "pending"

  - wave: "CR153-W2-METHOD-TESTS"
    objective: "Define event study method, test family and multiple-testing slots."
    parallel_lld: false
    parallel_dev_after_cp5: false
    entry_conditions:
      - "S01 event time semantics available for review"
    stories:
      - story_id: "CR153-S02-event-study-method-test-slots"
        title: "Event study method, test family and multiple-testing slots"
        priority: "P0"
        status: "lld-ready-for-review"
        depends_on:
          - "CR153-S01-event-research-time-pit-contracts"
        primary_files:
          - "engine/event_strategy_contracts.py"
          - "tests/research/test_event_driven_strategy_e2e_contracts.py"
        merge_owner: "CR153-S02-event-study-method-test-slots"
        lld_gate:
          required: true
          required_level: "full-lld"
          status: "pending"

  - wave: "CR153-W3-BIAS-RISK-SLOTS"
    objective: "Define cluster, endogeneity, CV and universe PIT audit slots."
    parallel_lld: false
    parallel_dev_after_cp5: false
    entry_conditions:
      - "S01/S02 contract semantics available"
    stories:
      - story_id: "CR153-S03-event-bias-risk-audit-slots"
        title: "Cluster, endogeneity, CV and universe PIT audit slots"
        priority: "P0"
        status: "lld-ready-for-review"
        depends_on:
          - "CR153-S01-event-research-time-pit-contracts"
          - "CR153-S02-event-study-method-test-slots"
        primary_files:
          - "engine/event_strategy_contracts.py"
          - "tests/research/test_event_driven_strategy_e2e_contracts.py"
        merge_owner: "CR153-S03-event-bias-risk-audit-slots"
        lld_gate:
          required: true
          required_level: "full-lld"
          status: "pending"

  - wave: "CR153-W4-EVENT-GATE"
    objective: "Define event admission gate and shared status adapter."
    parallel_lld: false
    parallel_dev_after_cp5: false
    entry_conditions:
      - "S01/S02/S03 evidence fields available"
    stories:
      - story_id: "CR153-S04-event-admission-gate-adapter"
        title: "Event admission gate and shared status adapter"
        priority: "P0"
        status: "lld-ready-for-review"
        depends_on:
          - "CR153-S01-event-research-time-pit-contracts"
          - "CR153-S02-event-study-method-test-slots"
          - "CR153-S03-event-bias-risk-audit-slots"
        primary_files:
          - "engine/event_strategy_admission_gate.py"
          - "engine/strategy_admission_package.py"
          - "tests/research/test_event_driven_strategy_e2e_contracts.py"
        merge_owner: "CR153-S04-event-admission-gate-adapter"
        lld_gate:
          required: true
          required_level: "full-lld"
          status: "pending"

  - wave: "CR153-W5-TRACE-EVIDENCE"
    objective: "Consolidate trace metadata and fixture-only evidence wording."
    parallel_lld: true
    parallel_dev_after_cp5: false
    entry_conditions:
      - "S01/S02/S03/S04 design decisions available"
    stories:
      - story_id: "CR153-S05-event-trace-evidence-wording"
        title: "Event-to-signal/order-intent trace and static evidence wording"
        priority: "P1"
        status: "lld-ready-for-review"
        depends_on:
          - "CR153-S01-event-research-time-pit-contracts"
          - "CR153-S02-event-study-method-test-slots"
          - "CR153-S03-event-bias-risk-audit-slots"
          - "CR153-S04-event-admission-gate-adapter"
        primary_files:
          - "process/returns/CR153-*.return.json"
          - "process/evidence/CR153-*.index.json"
          - "process/checks/CP7-CR153-*.result.json"
          - "process/checks/CP7-CR153-*.result.summary.md"
          - "process/checkpoints/CP8-CR153-*.md"
          - "process/release/RELEASE-CONTEXT-CR153.yaml"
          - "docs/release/RELEASE-NOTES.md (CR153 section only if CP8 explicitly requires release notes update)"
        merge_owner: "CR153-S05-event-trace-evidence-wording"
        lld_gate:
          required: true
          required_level: "technical-note"
          status: "pending"

