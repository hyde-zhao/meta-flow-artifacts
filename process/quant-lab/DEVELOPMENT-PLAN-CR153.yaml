  cp5_required_before_implementation: true
  credential_read_allowed: false
  real_event_feed_allowed: false
  live_event_listener_allowed: false
  real_data_validation_allowed: false
  real_lake_access_allowed: false
  nas_access_allowed: false
  provider_fetch_allowed: false
  qmt_runtime_allowed: false
  miniqmt_runtime_allowed: false
  xtquant_runtime_allowed: false
  simulation_live_allowed: false
  broker_access_allowed: false
  trading_allowed: false
  external_framework_run_allowed: false
  catalog_pointer_mutation_allowed: false
  event_store_write_allowed: false
  model_registry_write_allowed: false
  feature_label_prediction_store_write_allowed: false
  git_remote_write_allowed: false
  future_runtime_validation_policy: "Any real feed, listener, lake/NAS/provider, event store/catalog/registry, broker/runtime or real-data validation requires a separate authorization gate or formal CR."

feature_slices:
  - feature_id: "FEAT-03"
    name: "Research Dataset And Multifactor Research Loop"
    design_docs:
      - "process/docs/features/factor-research-loop/DESIGN.md"
      - "process/docs/features/factor-research-loop/TEST-PLAN.md"
      - "process/docs/features/factor-research-loop/TASKS.md"
