  gate_profile: runtime-high-risk
  expected_checkpoints:
    - CP0
    - CP1
    - CP2
    - CP3
    - CP4
    - CP5
    - CP6
    - CP7
    - CP8
  human_gates:
    - CP2
    - CP3
    - CP5
    - CP8
  cp4_cp6_na_allowed: false
  cp7_waiver_allowed: false
  real_read_before_cp2_approved: false
  implementation_before_cp5_approved: false

stage3_remaining_chain_after_path_a:
  - order: 1
    item: "C4-specific rework / authorization CR"
    closes: OI-CR171-003
    not_authorized_here: true
  - order: 2
    item: "FU-006 independent verifier lane"
    closes: OI-CR171-004
    must_complete_before: "E1 or E2"
    not_authorized_here: true
  - order: 3
    item: "FU-CR161-009 aggregate + final SAP + CR155 regression/promotion decision"
    closes: "aggregate/maturity exit gap"
    not_authorized_here: true
  - order: 4
    item: "OI-CR171-005 independent historical evidence revalidation/audit lane"
    closes: OI-CR171-005
    sequencing: "independent; does not merge into activation"
    not_authorized_here: true

claim_ceiling:
  stage3_started: false
