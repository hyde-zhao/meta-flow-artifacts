    recommendation: "不能冻结则选择 PATH-B，不创建/启动 activation implementation。"
  - id: DQ-CR172-002
    question: "FU-CR164-004 是否需要独立方法学审批、风险授权、发布节奏或回滚？"
    recommendation: "默认视为独立；只有全部 merge conditions 满足时才并入 C1 Story。"
  - id: DQ-CR172-003
    question: "C1 是否支持 effective_trial_count=typed_unavailable 的合法降级？"
    recommendation: "必须支持；binding 可完成，但 C1 computable/admission claim 保持 false。"
  - id: DQ-CR172-004
    question: "用户是否接受 C1-C3 三 producer 首次真实数据 blast radius？"
    recommendation: "不接受则选择 PATH-C；接受才选择 PATH-A。"
  - id: DQ-CR172-005
    question: "E1 是否明确只在后续 admission CR 试图给出 PASS/PASS_WITH_RISK 前触发？"
    recommendation: "必须明确；CR-172 CP8 和 component generation 均不触发 E1。"
  - id: DQ-CR172-006
    question: "OI-CR171-005 classification/revalidation 是否显式排除？"
    recommendation: "排除并保持独立 audit lane。"
  - id: DQ-CR172-007
    question: "若选择 PATH-C，C2/C3 是否按推荐各自建立独立 runtime-high-risk CR？"
    recommendation: "推荐独立 CR，总 CR 数为 3；只有同一五字段 revision、同审批/风险边界且 C1 CP7 通过时才考虑顺序 slice。"
  - id: DQ-CR172-008
    question: "若 effective-trial 与 activation owner 不同但拟合并，是否接受 ledger 双批准与风险边界取交集？"
    recommendation: "必须接受；否则拆分 FU-CR164-004。"

route_intent_if_path_a_is_authorized:
