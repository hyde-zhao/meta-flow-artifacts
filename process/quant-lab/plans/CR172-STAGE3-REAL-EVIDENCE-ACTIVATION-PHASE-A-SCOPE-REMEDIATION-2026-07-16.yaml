    failure_behavior: split_effective_trial_from_activation

scope_decision_tree:
  entry_question: "五字段具体值当前是否可由授权 data owner 冻结并在 CP2 审批？"
  branches:
    - id: PATH-B
      name: "Effective-trial offline first"
      when_any:
        - five_field_values_not_freezable
        - effective_trial_requires_distinct_methodology_approval_and_project_requires_c1_computable_before_activation
      next_candidate: FU-CR164-004
      proposed_cr_shape: "独立纯离线 methodology / implementation CR"
      scope:
        - effective-count method and assumptions
        - non-alias schema
        - deterministic golden vectors
        - validation and consumer projection
      excludes:
        - real data read
        - five-field authorization
        - provider/lake/NAS access
        - activation binding
      recommendation: >-
        五字段不可冻结时采用。该路径可立即推进但不会关闭 OI-CR171-001/002，
        也不会授权 Stage 3 activation。
      post_completion_handoff:
        activation_complete: false
        stage3_activation_authorized: false
        activation_cr_state: "若 CR-172 已正式启动，则保持 blocked/deferred；不得以 PATH-B CP8 关闭 activation 范围。"
        resume_trigger_all:
          - FU-CR164-004 completed and independently verified
          - five-field values freezable by authorized data owner
          - fresh CR conflict precheck passes
        next_required_action: "恢复 CR-172 的 requirement-clarification，并重新生成/重开 CP2 以在 PATH-C 与 PATH-A 中选择。"

    - id: PATH-C
      name: "C1-first bounded activation"
      when_all:
        - five_field_values_freezable
        - user_prefers_minimum_first_real_data_blast_radius
      proposed_cr_shape: "CR-172 只做 C1 binding；C2、C3 默认分别进入独立后续 runtime-high-risk CR。"
      scope:
        - five-field contract freeze
        - C1 release/schema/PIT/lineage/run-identity binding
        - typed_unavailable downgrade when effective count remains unavailable
      recommendation: >-
        首次真实数据访问希望最小化 blast radius 时采用。该路径只部分关闭
        OI-CR171-002，不得把 C1 单通道成功解释为 Phase A 全部完成。
      c2_c3_governance:
        default: independent_followup_crs
        projected_cr_count_including_cr172: 3
        projected_followups:
          - "C2 real-evidence activation CR"
          - "C3 real-evidence activation CR"
        why: >-
          C1 首次真实接触先验证 authorization contract、run identity、PIT/lineage、
          typed evidence 与 rollback 全链；C2/C3 各自重新做冲突、授权和验证门，
          避免 C1 通过被解释为对后续 producer 的预授权。
        alternative: sequential_slices_under_same_parent
        alternative_requires_cp2_explicit_approval: true
        alternative_conditions_all_required:
          - same_exact_five_field_contract_revision
          - same_approvers_and_risk_acceptance_boundary
          - c1_cp7_verified_without_unresolved_high_risk
          - separate_slice_context_return_evidence_and_cp6_cp7
          - rollback_can_disable_each_slice_independently
          - no_new_runtime_permission_or_file_owner_conflict

    - id: PATH-A
      name: "C1-C3 Phase A"
      when_all:
        - five_field_values_freezable
        - user_accepts_three_producer_blast_radius
      proposed_cr_shape: "一个 runtime-high-risk parent CR，三个独立 producer Stories"
      scope:
        - five-field contract freeze
        - C1 binding
        - C2 binding
        - C3 binding
        - shared run identity and evidence contract
      effective_trial_rule: >-
        FU-CR164-004 不默认并入。只有 owner、审批、风险授权、发布节奏和回滚边界
        与 activation 一致时，才可作为 C1 Story 纳入；否则保持独立 CR，C1 以
        effective_trial_count=typed_unavailable 合法降级。
      recommendation: >-
        五字段可冻结且用户接受 C1-C3 blast radius 时采用；CP4/CP5 必须证明
        三个 Story 可独立实现、验证和回修。

default_selection_policy:
  if_five_fields_unknown_or_unavailable: PATH-B
  if_five_fields_ready_and_minimum_blast_radius_preferred: PATH-C
  if_five_fields_ready_and_three_producer_scope_accepted: PATH-A
  if_five_fields_ready_without_explicit_three_producer_acceptance: PATH-C
  preferred_first_real_data_path: PATH-C
  no_implicit_default_to_path_a: true

base_in_scope_if_path_a:
  - "增量产品基线：bounded research-lake read、producer-local failure 和 claim-ceiling 场景。"
  - "五字段有限值：data_release、datasets、date_range、read_identity、output_directory。"
  - "六类 deny-default：credential/env、provider fetch、lake/NAS write、catalog/current-pointer mutation、runtime/trading、publish/deploy。"
  - "C1 release/schema/PIT/lineage/run-identity binding；effective count 可保持 typed_unavailable。"
  - "C2 fold/OOS release/schema/PIT/lineage/run-identity binding。"
  - "C3 cost/slippage/impact input/calibration release/schema/PIT/lineage/run-identity binding。"
  - "三个 producer 独立 context、return packet、evidence index、CP6 和 CP7 结论。"
  - "共享授权合同和共享 run identity 的完整审计，但不共享 producer-local PASS/FAIL。"
  - "仅在 CP2 明确批准后执行有限 read/computation；输出写权限必须与 read 权限分开表达。"

conditional_effective_trial_scope:
  candidate_ref: FU-CR164-004
  default: separate_or_deferred
  cp0_merge_conditions_all_required:
    - same_business_goal
    - same_approver_or_explicit_joint_approval
    - same_risk_authorization_boundary
    - same_release_cadence
    - compatible_rollback_boundary
    - no_file_owner_conflict
  explicit_joint_approval_contract:
    applicable_when: "data/activation owner 与 strategy-admission methodology owner 不同，但拟把 FU-CR164-004 纳入 CR-172。"
    gate_ledger_ref: process/state/GATE-LEDGER.ndjson
    approval_group_required_fields:
      - approval_group_id
      - checkpoint
      - cr_id
      - exact_scope_revision
      - exact_scope_hash
      - required_approver_roles
      - risk_boundary_intersection
      - rollback_boundary
      - status
    individual_approval_required_fields:
      - approver_identity
      - approver_role
      - approved_scope_revision
      - approved_scope_hash
      - accepted_risks
      - rejected_or_non_authorized_actions
      - approved_at
      - approval_source
    completion_rule: >-
      data/activation owner 与 methodology owner 必须分别对同一 scope revision/hash
      写入 approved 事件；两条批准均存在且 approval_group 状态为 approved 后才成立。
    effective_risk_boundary_rule: "取两位 owner 授权边界的交集与更严格约束，不得取并集扩大权限。"
    revision_change_rule: "五字段、method、claim ceiling、read/write 或 rollback 任一变化都会使旧 joint approval 失效并要求重新批准。"
    missing_or_partial_approval_behavior: split_effective_trial_from_activation
  c1_degraded_contract:
    effective_trial_count: typed_unavailable
    effective_trial_ref: empty
    effective_trial_method: empty
    raw_trial_count_alias_allowed: false
    c1_channel_binding_allowed: true
    c1_computable_claim_allowed: false
    admission_pass_claim_allowed: false
  split_effect: >-
    拆分 FU-CR164-004 不阻塞 C1 输入通道、release/PIT/lineage/run identity binding；
    但缺少有效 effective count 时，所有依赖 C1 computable/effective-count 的 claim
    必须保持 typed_unavailable 或 blocked。

independent_fail_closed_contract:
  shared_blockers_that_block_all_producers:
    - five-field authorization missing_or_ambiguous
    - read identity unauthorized
    - release/date scope escape
    - shared PIT or lineage contract invalid
    - forbidden operation attempted
  producer_local_failures:
    C1:
      effect: "C1 typed_unavailable/blocked；不得阻止 C2/C3 在共享前置条件满足时生成自身 evidence。"
    C2:
      effect: "C2 typed_unavailable/blocked；不得阻止 C1/C3 在共享前置条件满足时生成自身 evidence。"
    C3:
      effect: "C3 typed_unavailable/blocked；不得阻止 C1/C2 在共享前置条件满足时生成自身 evidence。"
  aggregate_effect: >-
    任一 producer 未达到后续 aggregate contract 要求时，整体 admission/aggregate
    继续 blocked；producer-local 隔离不等于 OR-pass。

