  fu006_independent_evidence_complete: false

gotchas:
  - "FU-CR164-004 才是 effective-trial；FU-CR164-001 是 independent Agent/model verification。"
  - "C1 channel binding 可在 effective count 不可用时完成，但不能声明 C1 computable。"
  - "producer-local failure isolation 不是 OR-pass；整体 admission 仍可被任一缺失项阻断。"
  - "五字段中的 output_directory 不等于写授权；任何 write 必须单独列明。"
  - "CR-172 CP8 不触发 E1，也不授权 Stage 3 exit gate。"
  - "OI-CR171-005 的 classification 与 repair 都不属于 activation。"
  - "正式 CR 只因用户于 2026-07-16 明确授权推进到下一人工门禁而创建；该授权仍不包含真实数据或 runtime 操作。"
  - "PATH-B 是 activation 前置而非替代；estimator 完成后仍需在五字段可冻结时恢复 PATH-C/A。"
  - "PATH-C 默认产生 C1、C2、C3 三个独立 activation CR；改为同 parent slices 必须在 CP2 显式批准。"
  - "joint approval 必须有两位 owner 对同一 revision/hash 的 ledger 事件，权限按交集解释。"

