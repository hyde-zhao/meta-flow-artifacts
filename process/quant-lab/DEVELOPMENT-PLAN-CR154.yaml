  cp5_attention_items:
    - id: "CP5-FOCUS-CR154-001"
      story: "CR154-S01-shared-gate-contract-fixture-skeleton"
      requirement: "Fixture schema and first runnable fixture must live in S01; Phase A cannot be an unverifiable empty shell."
    - id: "CP5-FOCUS-CR154-002"
      story: "CR154-S02-statistical-artifacts-and-trap-severity"
      requirement: "Define 12 statistical reliability artifact slots, WRC/SPA severity mapping, DSR/PBO/trial policy and strategy-family adapter subtasks."
    - id: "CP5-FOCUS-CR154-003"
      story: "CR154-S02 / CR154-S04 / CR154-S05"
      requirement: "Define cross-gate propagation: Gate 3/4 blocked states must populate Gate 1 refs, blocked claims and release-blocking reason."
    - id: "CP5-FOCUS-CR154-004"
      story: "CR154-S06-regime-attribution-reconciliation-slots"
      requirement: "Gate 5 must be implemented as explicit slot/status/ref/n/a contract; it cannot be hidden in compatibility or release wording."
    - id: "CP5-FOCUS-CR154-005"
      story: "CR154-S07-admission-default-policy-tier-resolution"
      requirement: "Tier resolution must be an explicit full-lld design with config/function boundary, per-strategy overrides, fallback rules and fail-closed unknown profile."
    - id: "CP5-FOCUS-CR154-006"
      story: "CR154-S08-compatibility-follow-through-wording"
      requirement: "Preserve MF-GAP-2/6/7 deferred mapping, REQ anchor mapping and no-runtime/no-real-data release wording."

parallel_policy:
  max_parallel_lld: 5
  max_parallel_dev_after_cp5: 1
  max_parallel_verification_after_cp6: 2
  phase_b_parallel_lld_rule: "S02-S06 may be drafted in parallel after S01 because their gate semantics are separable. They still share future module/test files, so implementation merge should be serial unless CP5 assigns disjoint sections."
  same_file_merge_rule: "S01 owns base schema; S02-S06 own named gate sections; S07 owns admission tier resolver after S02-S06; S08 owns exact evidence/release wording targets. Any overlapping field ownership returns to CP5 design."
  b1_workload_rule: "S02 is expected critical path; CP5 LLD must split adapter subtasks by multifactor, ML and event-driven strategy family."

